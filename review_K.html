<script>
const L = "K", ITEMS = [{"t": "head", "wid": "K.kǎ.050", "char": "卡", "pinyin": "kǎ", "group": "kǎ", "meaning": "①英语card的音译。卡片。如：资料卡；年历卡。②全称“卡路里”。热量的非法定计量单位。历史上曾定义为：1克纯水在101.325千帕下当温度升高1℃时所吸收的热量。后规定，1卡=4.186焦。1948年以后国际上规定，与其他形式的能量一样，也采用“焦耳”作为热量的单位，并建议不再使用卡。③英语car的音译。卡车;供运输用的载重汽车。如：十轮卡。录音机上放置盒式磁带的装置。如：双卡录音机。⑤磁卡。如：信用卡；公共交通卡。 另见3442页qiǎ。", "entries": [["卡巴迪", "一种盛行于南亚的运动竞赛项目。源于印度民间游戏。因比赛时双方要不断呼喊“卡巴迪”（意为“看谁最强最勇敢”)而得名。赛场长12.5米、宽10米(女子和少年赛场长11米、宽8米)，以中线为界，分为两个半场，每半场的二分之一处画有一条拦截线。比赛分两队，每队7人上场。赛时两队轮流分任攻守方，攻方派一人冲过中线到对方半场，过拦截线后用手或脚触及防守队员并迅速撤回本场，即为本队得1分；如被守方擒获，则攻方失1分。比赛分上下两半场，每半场20分钟(女子和少年比赛为15分钟)，中间休息5分钟。以积分多者为胜。"], ["卡巴尔达人", "()俄罗斯北高加索的民族。先民阿迪盖人原住库班河流域和黑海东岸，12—14世纪由西向东迁今住地。约30.4万人(2001年)。主要分布在卡巴尔达-巴尔卡尔共和国，部分在卡拉恰伊-切尔克斯共和国。语言属高加索语系西部(阿布哈兹-阿迪盖)语族，有文字。信伊斯兰教。主要从事农业，部分从事游牧业。另有少数人在西亚。"], ["卡巴粒", "草履虫等纤毛虫细胞质中的一种共生细菌。具遗传独立性，依赖宿主的大核基因生存。含有卡巴粒的草履虫产生一种毒素，可导致不含卡巴粒的敏感性草履虫死亡。"], ["卡巴列夫斯基", "( -，1904—1987)苏联作曲家、音乐教育家。毕业于莫斯科音乐学院，后留校执教。1940—1946年任苏联作曲家协会机关刊物《苏联音乐》主编。1952年任苏联作曲家协会书记。1969年起任苏联教育科学院主席团所属美育委员会主席。作品多以苏联现实生活为题材，主要有歌剧《塔拉斯一家》《哥拉·布勒尼翁》，《第三交响曲》(纪念列宁的追思曲)、《第四交响曲》，管弦乐“青年三部曲”(《小提琴协奏曲》《第一大提琴协奏曲》《第三钢琴协奏曲》)及献给卫国战争牺牲者的清唱剧《安魂曲》等。"], ["卡贝", "(Étienne Cabet,1788—1856) 法国空想共产主义者。波旁王朝复辟时期为烧炭党人。1830年七月革命后，当选为议员。后因反对七月王朝，流亡英国。1840年发表《伊加利亚旅行记》，宣扬“和平的共产主义”思想。1847年在美国进行建立共产主义移民区(伊加利亚公社)的试验，遭到失败。次年法国二月革命后，组织“中央兄弟会”，支持资产阶级临时政府。主张废除私有制，用和平改良的方法建立他理想中的共产主义社会。主要著作还有《一八三年法国革命通俗史》等。"], ["卡奔塔利亚湾", "(Gulf of Carpentaria) 阿拉弗拉海南部海湾。位于澳大利亚北部阿纳姆地与约克角半岛(York)之间。南北长约600千米，东西最大宽度670千米。面积31万平方千米。水深50\\~70米。海面水温冬季23\\~25℃,夏季29℃。盐度34.8。"], ["卡比尔人", "(Kabyle) 柏柏尔人的一支。约600万\\~900万人(2012年)。分布在卡比利亚和奥雷斯地区。语言属闪-含语系柏柏尔语族，通用阿拉伯语。信伊斯兰教。从事农牧混合经济，不少人流入城市和工业区做工。"], ["卡比拉", "(Laurent Kabila,1939—2001) 刚果民主共和国总统(1997—2001)。1961年底参加刚果“全国解放委员会”的武装斗争。1967年成立人民革命党。1996年成立解放刚果-扎伊尔民主力量联盟。1997年5月推翻蒙博托政府，改国名为刚果民主共和国，任总统兼国防部长。2001年1月遇刺身亡。"], ["卡宾", "英语carbene的音译。亦称“碳烯”“碳宾”。电中性的含有二价碳原子的亚甲基（:CH2)及其衍生物。以通式：CR2表示，R可能是H、卤素、烷基、芳基、COOR、CN等基团。是某些有机反应中产生的活泼中间体，通常在反应(裂解和消除)过程中形成，半衰期很短，一经形成即和烯烃等不饱和化合物的双键起加成等反应。"], ["卡宾达", "(Cabinda)①安哥拉一省。位于非洲西部刚果(金)和刚果(布)之间，西濒大西洋。面积7270平方千米。人口71.6万(2014年)。居民主要是巴刚果人。首府卡宾达港。东北部为山地，其余大部为平原。多森林。1723年起被葡萄牙殖民者侵占，后划入葡属安哥拉。经济以石油和农、林业为主。主产并出口咖啡、可可、贵重木材、棕榈产品等。石油产量占全国的70%。②安哥拉西北部港市，卡宾达省首府。西濒大西洋。人口59.8万(2014年)。现代化人工港。主要输出石油和木材。有专用石油码头和输油管道系统，可停泊10万\\~15万吨油轮。有食品、木材加工等工业。陆上运输以公路为主，有航空站。"], ["卡宾枪", "亦称“骑枪”“马枪”。枪身较短的步枪。“卡宾”是英语carbine的音译。最初供骑兵使用，多为制式步枪的缩短型。德国98式毛瑟步枪的缩短型——7.92毫米 98k型是第一支近代卡宾枪。最典型的卡宾枪是美国20世纪40年代装备的发射专用枪弹的7.62毫米M1和M2式卡宾枪。70年代后，鉴于骑兵在军队编制中消失，改称短步枪、短突击步枪。"], ["卡波特", "(Truman Capote,1924—1984) 美国小说家。曾在纽约圣约翰学院求学。早期作品具有美国南方文学的传统，后收入短篇小说集《黑夜之树及其他故事》中。1958年发表成名作中篇小说《蒂凡尼的早餐》。1966年发表的《冷血》，记叙了堪萨斯州一农家惨遭抢劫杀戮的悲剧，被认为是美国纪实小说的开山之作。其他作品还有长篇小说《别的声音，别的房间》，中篇小说《草竖琴》。《给变色龙听的音乐》收有若干短篇小说及其他非虚构作品。"], ["卡波西肉瘤疱疹病毒", "人疱疹病毒8型(HHV-8)。首先在患有卡波西肉瘤的艾滋病病人中分离到。感染B细胞，也可感染内皮细胞。主要感染艾滋病病人或免疫功能低下的病人。"], ["卡达尔", "(Kádár János,1912—1989) 匈牙利社会主义工人党第一书记(1957—1985)、总书记(1985—1988)。1931年加入共产党。1946—1948年先后任匈共副总书记、内务部长。1956年任匈牙利劳动人民党政治局委员、中央书记。同年匈牙利事件期间出任党的第一书记和工农革命政府总理。1957年起任匈牙利社会主义工人党第一书记(1985年改称总书记)。1988年任党的主席。次年被解职。"], ["卡德尔", "(Edvard Kardelj,1910—1979) 南斯拉夫共产主义者联盟领导人。1928年加入南斯拉夫共产党。1938年当选为南共政治局委员。第二次世界大战期间，参与领导国内反法西斯战争，战后历任联邦政府副主席、外交部长，南共联盟中央主席团委员、中央书记，联邦执委会副主席，劳动人民社会主义联盟总书记等职。1963—1967年任联邦议会主席。1974年为联邦主席团委员。提出南斯拉夫社会主义自治制度的理论。"], ["卡德摩斯", "(Kadmos) 希腊传说中的腓尼基王子。曾杀巨龙，埋其齿，结果长出一批武士，相互残杀，最后剩下五人，与他一起建立了底比斯城，并将腓尼基字母传入希腊。"], ["卡德纳斯", "(Lázaro Cárdenas del Río, 1895—1970)墨西哥总统(1934—1940)。早年参加墨西哥革命。1928年获少将衔。总统任内，实行铁路国有化，把美、英石油企业收归国有，推行土地改革。第二次世界大战期间曾任国防部长，积极支持世界反法西斯战争。战后参加保卫世界和平的活动。曾任世界和平理事会副主席。"], ["卡迪", "阿拉伯语qādī的音译,亦译“戛最”，旧译“哈的”“嘎锥”。伊斯兰教法官。这一职位由第二任哈里发欧麦尔所创设，常从宗教学者中选拔精通教法、执法公正廉明者担任，以监督实施教义和教法，处理穆斯林的民事、刑事诉讼，管理义产(卧格夫)。最高法官主管全国司法工作。今大多数伊斯兰国家实施世俗民法和刑法，卡迪成为司法官员，专门处理穆斯林宗教行为问题；或成为民间仲裁人，处理、调解民间宗教和民事纠纷。中国旧时有些地区清真寺曾设卡迪，协助教长处理穆斯林纠纷和教法问题。在新疆曾译称“卡孜”。"], ["卡地纳健康公司", "美国和全球最大的保健品企业之一。前身是1971年成立的卡地纳食品公司。1979—1980年开始从事药物批发，改称卡地纳销售公司。1994年改现名。主要业务包括发展、制造、销售与保健有关的产品及提供相关服务。总部在俄亥俄州都柏林。"], ["卡的普南", "他加禄语Katipunan的音译，意为“协会”，全名“民族儿女最尊贵协会”。菲律宾反对西班牙殖民统治的秘密革命团体。1892年7月7日由滂尼发秀在马尼拉领导创立。主张“保卫被压迫者，与压迫者作斗争”。成员主要是小资产阶级、农民、城市贫民和知识分子。领导机关为最高委员会。1896年发动并领导菲律宾独立战争。翌年阿奎纳多集团夺取领导权，杀害滂尼发秀，组织遂解体。"], ["卡迭石战役", "古埃及与赫梯争夺叙利亚地区统治权的一次会战。约公元前1300年，埃及法老拉美西斯二世率军进入叙利亚，被赫梯军队围困于奥伦特(Orontes)河畔的要塞卡迭石(Kadesh，今叙利亚北部霍姆斯附近)，法老失利，得援军救助才退回埃及，赫梯人占据了大马士革地区。前1283年法老与赫梯缔订和约。其原文在埃及神庙和赫梯档案库里均有发现，为保留至今最早的条约文献。"], ["卡杜尔拉", "(Alejandro García Caturla，1906—1940)古巴作曲家。先后在哈瓦那和法国巴黎学习作曲。曾创建加勒比音乐会乐队和古巴室内乐队，并自任指挥。作有管弦乐组曲《古巴舞曲三首》、供合唱和乐队演出的宗教仪式交响诗《扬巴-哦》、8件木管乐器与钢琴合奏的《第一古巴组曲》、管弦乐《伦巴》、14件乐器合奏的《本拜组曲》、钢琴《奏鸣曲与前奏曲》等，富有古巴的民族色彩、错综复杂的节奏与现代派和声。"], ["卡多人", "(Caddoans)美国印第安人。约8000多人(2001年)。语言属印第安诸语言中的卡多语族。从事农业，种植玉米、南瓜等，兼营狩猎；有制陶、纺织、硝皮等手工业。崇拜自然神。原居今美国南部雷德河(Red)流域，土地先后被西班牙、法国殖民者和美国统治者掠夺，被迫迁入俄克拉荷马州。"], ["卡多佐", "(Benjamin Nathan Cardozo,1870—1938)美国法学家。哥伦比亚大学毕业。历任律师，纽约州上诉法院法官、首席法官，美国最高法院法官。以在美国最高法院中支持罗斯福“新政”而闻名。认为法官可根据逻辑推理、历史演变，也可根据社会习惯、正义与社会福利等方法来平衡各种冲突的利益。主要著作有《司法过程的性质》《法律的成长》《法律科学中的矛盾》等。"], ["卡尔", "(EdwardHallett Carr，1892—1982)英国历史学家。毕业于剑桥大学。曾任职外交界。1936年起先后执教于威尔士、牛津、剑桥等大学。对第一次世界大战后流行的政治理想主义作出系统总结和批判，认为不同的国家不存在共同的国家利益。提出国际政治学最基本要素是权力，一切政治都是权力政治，权力比道德对政治的影响更大。主张国际关系理论研究重点应从理想主义转向现实主义。主要著作有《二十年危机(19191939)》《苏维埃俄国史》《历史是什么?》等。"], ["卡尔巴拉", "(Karbalā')伊拉克中部城市，卡尔巴拉省首府。位于幼发拉底河下游右岸的迈杰拉运河(Majarrah)畔。人口69.01万(2014年)。旧市区有城墙围绕，新市区在其南侧。粮食、椰枣贸易甚盛。公元7世纪起为伊斯兰教什叶派圣地，有该派创始人阿里次子侯赛因的陵墓。"], ["卡尔波", "(Jean Baptiste Carpeaux,1827—1875)法国雕塑家。师从吕德。作品生动活泼，结构紧凑，但有的为迎合上层社会的趣味而流于浮华。有为巴黎大歌剧院作的《舞蹈》、为卢浮宫作的《花神》和为卢森堡公园作的喷泉雕塑等。"], ["卡尔达诺", "(GerolamoCardano, 1501—1576)利数学家、医生。帕多瓦大学医学博士。曾任帕维亚大学和博洛尼亚大学教授。1545年著《大术》，首先介绍了从塔尔塔里亚( Niccolò Tartaglia,1499—1557)那里得来的三次方程的解法，及其学生费拉里(Ludovico旧译“卡当”。意大Ferrari，1522—1565)发现的四次方程的解法。在医学上，首次对斑疹伤寒作了病理描述。有自传《我的生活》。"], ["卡尔大公", "(Karl von Österreich-Teschen,1771—1847)奥地利大公，军事理论家。奥皇弗兰茨一世(FranzI，1804—1835年在位，即神圣罗马帝国皇帝弗兰茨二世）之弟。1793—1809年参加对法战争，为拿破仑一世之劲敌。在最高军事委员会主席、陆军大臣任内，实行军制改革。1796年升元帅。1809年第五次反法同盟期间任奥军总司令。著有《从1796年德国战局论战略原理》《论将领的战术》等。"], ["卡尔德隆", "(Pedro Calderón de la Barca,1600—1681) 西班牙剧作家。生于贵族家庭。长期为王室写作。后在教会供职，被任命为国王的名誉神父。写有喜剧、悲剧、宗教剧等共120部。大多宣传人生无常的宗教观点，也有肯定现世幸福的人文主义主题。剧作结构严谨，情节复杂，富有抒情特点。代表作为《人生如梦》，其他主要作品还有《空气的女儿》《查拉美亚的法官》《温顺的妇人》《始终不渝的王子》等。"], ["卡尔杜齐", "(Giosuè Carducci,1835—1907)意大利诗人。曾任博洛尼亚大学文学教授。1872年加入第一国际意大利支部，不久退出，同资产阶级自由派接近，后被选为参议员。前期作品《撒旦颂》《致朱塞佩·加里波第》《土耳其人的收获》等，反对天主教会和封建制度，拥护资产阶级革命。后期诗歌《野蛮颂》《韵律和节奏》等，多运用历史题材，抒写个人感情。还著有《意大利民族文学发展史》等。获1906年诺贝尔文学奖。"], ["卡尔多", "(Nicholas Kaldor,1908—1986) 英国经济学家。新剑桥学派代表人之一。生于匈牙利布达佩斯。1927年起在英国就读，后在伦敦政治经济学院和剑桥大学执教。20世纪30年代因在福利经济学领域提出“补偿原理”思想而出名。在收入分配方面，以IS-LM原理为基础加入储蓄函数的分析，揭示出投资率与资本收入的储蓄率之间的依存关系，形成一套系统的凯恩斯主义宏观分配理论。主要著作有《经济论文集》《再论应用经济学》等。"], ["卡尔费尔特", "(Erik Axel Karlfeldt，1864—1931)瑞典抒情诗人。生于农民家庭，后毕业于乌普萨拉大学。当过教师，曾任诺贝尔文学奖评委和终身秘书。新浪漫派作家。写有《荒野和爱情之歌》《弗里多林之歌》《弗里多林的乐园》《弗洛拉和波玛拉》等诗集，主要描写故乡自然景色、农民的生活和风俗习尚。文笔优美朴素，情感自然真挚。获1931年诺贝尔文学奖。"], ["卡尔加里", "(Calgary) 加拿大西南部艾伯塔省城市。跨鲍河(Bow)两岸，西近落基山麓。市区人口123.92万，大都市区人口139.26万(2016年)。1893年设市，1914年城西南发现石油、天然气后，城市迅速发展。加拿大石油工业中心，炼油、石化工业发达；省南部农牧产品的集散地和加工中心。计算机软件、信息技术和金融、旅游业发展较快。横贯大陆的铁路、公路干线经此，城北有国际机场。有卡尔加里大学和表演艺术中心、遗产公园及格伦堡博物馆等文化设施。"], ["卡尔·马克思", "全称《卡尔·马克思(传略和马克思主义概述)》。列宁为《格拉纳特百科词典》撰写的词条，1914年11月完稿。编入《列宁全集》第1版第21卷、第2版第26卷，《列宁选集》第1、2、3版第2卷。简要介绍了马克思为无产阶级解放事业奋斗的伟大一生和他的学说，指出马克思主义是马克思的观点和学说的体系，是世界各国工人运动的理论和纲领。扼要阐述了马克思主义哲学、政治经济学、科学社会主义的基本原理和无产阶级阶级斗争的策略，并阐明这些基本原理和策略原则之间的相互关系。"], ["卡尔·马克思城", "见“开姆尼茨”(2342页)。 下小与元芯城 见开姆伙(24贝)。"], ["卡尔马联盟", "丹麦、瑞典、挪威三国以丹麦王为共主的联盟。1397年在瑞典南部卡尔马城(Kalmar)正式结成。规定：三国须拥立丹麦女王玛格丽特(Margrete，1353—1412)的外孙埃立克(Erik，约1381—1459)及其后裔为共主；外交、国防接受丹麦控制，司法、行政由瑞典和挪威自理。丹麦对瑞典、挪威的掠夺和压迫常激起两国人民的反抗。1523年瑞典终将丹麦的势力逐出。丹麦和挪威的联合一直维持到1814年。"], ["卡尔马特共和国", "伊斯兰教什叶派的一支卡尔马特教派(Karmati)建立的国家。公元9世纪末，卡尔马特教派在伊拉克、叙利亚和阿拉伯半岛等地发动反对阿拔斯王朝的起义。899年以阿布·赛义德·哈桑·加纳比(Abū Saīd al-Hasan Jannābī,?—913) 为首的起义军，在波斯湾西岸一带建立寡头制共和国，定都阿赫萨(al-Ahsa,今胡富夫)。930年占领麦加。共和国延续至11世纪下半叶。"], ["卡尔曼", "(KálmánImre,1882—1953)匈牙利作曲家。毕业于布达佩斯音乐学院。1938年前常住奥地利维也纳。1938—1940年寓居法国巴黎。后去美国。1949年重返巴黎。作有轻歌剧《恰尔达什公爵夫人》(原名《西尔瓦》)、《秋季演习》、《舞姬》、《马戏团公主》等20余部。音乐大多轻快、优美而富于戏剧效果。又作有交响诗《农神节》及其他器乐曲、声乐曲等。"], ["卡尔梅克人", "() 俄罗斯联邦民族。约15万人(2001年)。主要分布在卡尔梅克共和国，部分在西西伯利亚、中亚等地。中国文献称“土尔扈特”，为蒙古卫拉特四部之一。16世纪末17世纪初由中国向西北迁移。语言属阿尔泰语系蒙古语族，有文字。部分信藏传佛教。从事农牧渔业。"], ["卡尔米纳·布拉纳", "拉丁语Carmina Burana的音译，意为“博伊伦之歌”(SongsfromBeuern)。带有舞台表演的清唱剧或康塔塔。德国作曲家奥尔夫1934—1936年作，其歌词选自在巴伐利亚州贝内迪先特博伊伦修道院(Benediktbeuern Abbey)中发现的一本13世纪的诗集。1937年初演于法兰克福，后作为康塔塔单独演出。共分25个乐章，用女高音、男高音、男低音、童声合唱、合唱及乐队(内有14个乐章为管弦乐曲)组成。歌词用拉丁文，其内容多与爱情、饮酒和狂欢有关，分为三大部分：春；小酒店；爱情。演出时有哑剧动作，伴有丑角和舞蹈场面。乐曲写作手法简单，摒弃了常用的对位、主题发展、变奏等，而是用同度、八度、三度的声部进行，句段多重复，音效极佳。"], ["卡尔莫纳", "(António Óscar de Fragoso Carmona, 1869—1951) 葡萄牙总统（1928—1951）。1922年升为将军。翌年任陆军部长。1926年参加军人政变后，任总理兼陆军部长，成为军人专政政府的首脑。1928年起多次连任总统。1932年萨拉查任总理后，实权逐渐丧失。"], ["卡尔纳普", "(RudolfCarnap，1891—1970)哲学家、逻辑学家，逻辑实证主义主要代表之一。原籍德国。耶拿大学哲学博士。曾在维也纳大学、德意志大学(今查尔斯大学)执教，为维也纳学派重要成员。1935年去美国，任芝加哥大学、加利福尼亚大学教授。1941年入美国籍。其思想发展一般认为可分三个阶段。第一阶段至20世纪30年代初止，以阐发逻辑经验主义为特征，主要有《世界的逻辑结构》等著作。第二阶段为1934—1936年，以阐发句法学为特征，认为哲学是语言的逻辑句法，主要有《哲学与逻辑句法》等著作。第三阶段从1936年起，以阐发哲学语义学为特征，不仅将语言的形式方面，而且将语言的涵义方面也作为研究对象，主要著作有《语义学导论》《符号逻辑引论》等。"], ["卡尔内", "(Marcel Carné,1909—1996)法国电影导演。生于巴黎。毕业于美术学校。早期当过《电影杂志》记者。1929年起从影。曾先后执导《雾码头》《天堂儿女》《太阳升起》《夜间来客》等影片。其作品被认为是法国20世纪30—40年代“诗意现实主义”电影的代表作，主要反映社会下层人物的悲惨命运，洋溢着强烈的人道主义精神。"], ["卡尔十二世", "(KarlI，1682—1718) 亦译“查理十二”。瑞典国王(1697—1718)。在位时加强王权，进行北方战争，对抗俄、波、丹三国联盟。曾战胜丹麦，挫败俄国，击败萨克森与波兰。1704年扶植列琴斯基(StanisławLeszczyński，即斯坦尼斯瓦夫一世〔Stanisław Ⅰ]，1677—1766)为波兰国王。1707年进攻俄国，1709年败于波尔塔瓦(Π)。转往土耳其寻求支持。1714年回国。1718年进攻挪威时战死。"], ["卡尔斯", "卡尔斯(Kars)旧译“喀斯”。土耳其东北部城市。跨卡尔斯河两岸，近亚美尼亚边境。人口7.8万(2012年)。公元9—10世纪时为亚美尼亚公国都城，16世纪为奥斯曼帝国军事要塞，1878年后曾属帝俄，1920年划归土耳其。附近为农、畜产品集散中心。以干酪、地毯、皮革制造业著名。旧城在河北，新城在河南，以桥梁相连。铁路通亚美尼亚的久姆里。"], ["卡尔斯巴律双晶", "简称“卡式双晶”。长石晶体(单斜或三斜晶系)中以c轴为双晶轴的双晶。接合面通常平行于(010),个别平行于(100)。多数成简单的贯穿双晶或接触双晶；也可见到由少量几个单体组成的聚片双晶。"], ["卡尔斯鲁厄", "卡尔斯鲁厄(Karlsruhe) 德国西南部城市。位于莱茵河东岸，黑林山北缘。人口30.78万(2016年)。1715年始建。曾是巴登州(Baden)首府。有全国最大的炼油厂，以及核反应堆、原子研究中心，还有电器、机械、制药等工业部门。卡尔斯鲁厄理工学院(1825年)为德国第一所工程技术大学。"], ["卡尔索集团", "墨西哥综合性企业。拉美最大的企业集团之一。成立于20世纪80年代。经营范围多元化，包括零售、工业和消费品等。总部在墨西哥城。"], ["卡尔维诺", "卡尔维诺(Italo Calvino,1923—1985) 意大利小说家。生于古巴，随父母移居意大利。主要作品有长篇小说《通向蜘蛛巢的小径》《如果在一个冬晚，有一位旅人》，长篇小说三部曲《我们的先人》(《分为两半的子爵》《树上的男爵》《不存在的骑士》)等。另编有《意大利童话》。"], ["卡菲尔人", "卡菲尔人(Kafirs)①阿拉伯人对住在阿富汗东北部和巴基斯坦吉德拉尔(Chitrāl)地区非伊斯兰教徒的称呼，意即“异教徒”。现阿富汗境内的改称“努里斯坦人”。②18世纪布尔人对南非科萨人的贬称。源出阿拉伯语，意即“非伊斯兰教徒”“不懂文明者”。随后成为白人殖民者对南非班图各族的蔑称。"], ["卡芬雅克", "卡芬雅克(Louis Eugène Cavaignac,1802—1857)法国将领。1832年起奉派侵占阿尔及利亚。1844年升准将，1848年任阿尔及利亚总督。同年任陆军部长，血腥镇压巴黎六月起义；一度为第二共和国政府首脑；同年竞选总统失败。其名字后来成为屠杀工人的刽子手的代称。"], ["卡夫卡", "卡夫卡(Franz Kafka, 1883—1924)奥地利作家。现代主义、表现主义文学的重要代表。生于布拉格犹太商人家庭。主要作品有长篇小说《美国》《审判》和《城堡》(均未完成)，短篇小说《变形记》《在流放地》和《地洞》等。多描写人的孤独以及人在不可思议的力量面前的渺小，带有浓厚的神秘气息。常把现实生活的细节和幻想情境交织在一起，用假定的场景、荒诞无稽的情节突出人的某种普遍生存处境和内心状态。在当代西方文学中占有重要地位。"], ["卡夫雷拉·因方特", "卡夫雷拉·因方特(Guillermo CabreraInfante,1929—2005)作家。原籍古巴。早年学医，后弃医从文。参与创建古巴电影制片厂，发表影评。支持古巴革命，曾任古巴国家文化委员会主席、驻布鲁塞尔文化参赞，后因政见不同移居伦敦并入籍英国至去世。1967年发表小说《三只悲伤的老虎》，描写巴蒂斯塔独裁统治后期的哈瓦那社会生活，结构独特，语言表达手段丰富，被视为拉美新小说代表。作品还有小说《跳恰恰舞之罪》《一切尽是空镜子》，散文集《风格的辟邪》，影评集《二十世纪的一项任务》等。1997年获塞万提斯奖。"], ["卡富埃国家公园", "卡富埃国家公园(KafueNational Park)亦称“卡富埃野生动物公园”。赞比亚最大的野生动物公园，非洲面积最大的天然动物园之一。位于赞比亚中西部，卡富埃河中游右岸。面积约2.25万平方千米。1950年始建。是多种野生动物繁衍、生息地。鸟类品种繁多，有600多种。森林栖息野象、河马、斑马、野牛、狮子、长颈鹿、豹、羚羊等。非洲著名旅游地。"], ["卡冈诺维奇", "卡冈诺维奇( ,1893—1991)苏联领导人。1911年加入俄国社会民主工党。1924年为俄共(布)中央委员。1925—1928年任乌克兰党中央第一书记。1928年任联共(布)中央书记。1930年为政治局委员，同年兼任莫斯科市委第一书记。1935年起历任交通、重工业、燃料工业、石油工业人民委员等职。1938年兼任苏联人民委员会副主席。卫国战争期间为国防委员会委员。战后任部长会议第一副主席等职。1952年为苏共中央主席团委员。1957年被解职。"], ["卡哈尔", "卡哈尔(Santiago Ramón y Cajal,18521934)亦译“拉蒙-卡哈尔”。西班牙神经组织学家。历任巴伦西亚大学、巴塞罗那大学、马德里大学教授。对神经组织的研究贡献卓著。改进高尔基的铬银染色法，并用于研究大脑皮层的灰质区，纠正当时流行的神经组织是网络结构的说法。证明长的神经纤维只在末梢才与另外的神经细胞接触。致力于神经元实验，认为信息从一个神经元之轴突传入另一神经元树突，传导是单向的。还研究神经组织的退化和神经纤维的再生，以及神经胶质和昆虫的复眼。与高尔基共获1906年诺贝尔生理学或医学奖。"], ["卡赫美士战役", "公元前605年新巴比伦王国与米堤亚联合打败亚述、埃及的战役。新巴比伦国王那波勃来萨派其子(即后来的尼布甲尼撒二世)率联军进攻亚述帝国的残余势力。埃及法老尼科二世出兵援助后者。双方在幼发拉底河上游的卡赫美士(Carchemish)激战。结果埃及军败退，亚述帝国灭亡。"], ["卡霍拉巴萨水库", "非洲大型水利工程。位于莫桑比克西北部，赞比西河中游。1974年建成，1978年投入使用。大坝高168米、长330米，形成面积2660平方千米的人工湖。库容量640亿立方米。有发电、灌溉、航运、防洪多种效益。水电站装机容量415万千瓦，是非洲大型水电站之一。电力除供应本国，还大量输出。"], ["卡基纳达", "旧称“科卡纳达”(Cocanada)。印度东南部安得拉邦(Andhra)港市。位于戈达瓦里河三角洲东部北侧,濒孟加拉湾。人口31.3万(2011年)。沿岸水浅，海轮停泊岸外数千米。萨尔特河(Salt)南为工业区。以乐器制造和炼铝业闻名，多碾米厂。棉花输出港。"], ["卡介苗", "由一种减毒的牛型结核杆菌变种制成的活菌苗。新生儿接种后可有效预防结核病。为法国细菌学家卡尔美(LéonCharlesAlbert Calmette,1863—1933)和介林(CamilleGuérin,1872—1961)创用，故名。"], ["卡介苗接种", "用于预防小儿结核病的有效方法。中国列入计划免疫，新生儿期接种。接种方法为上臂外侧三角肌中部皮内注射和皮肤划痕法。接种部位于2\\~3周后出现红肿硬结，逐步形成小脓疱或小的浅表溃疡，约2个月结痂，腋下淋巴结可轻度肿大，无须特殊处理，一般无全身反应，痂盖脱落后会留下卡疤。保护力可维持至少10年。世界卫生组织不再提倡用结核菌素皮试决定卡介苗复种，中国也已停止推行复种卡介苗工作。"], ["卡克斯顿", "(WilliamCaxton,1422—1491)英国出版家。早年在比利时从事纺织贸易。1476年回国设立印刷所，引入先进的印刷设备和印刷技术。印刷出版了近百种书籍，涉及宗教经籍、神学著作、骑士传奇、诗歌、百科全书、历史、哲学等。并亲自翻译了20余种外国文学作品。"], ["卡拉", "(Carlo Carrà，\n\n1881—1966)意大利画家。曾在米兰布雷拉学院学习、任教。1909年加入未来主义画家团体。1915年在契里科(Giorgio deChirico,\n\n1888—1978)影响下参加形而上画派。其未来主义绘画具有立体主义特征，把对象从多方面同时表现出来，且使用中性色彩。其绘画运用傍晚光线表现荒凉的街道、古代的废墟、木头模特儿以及由几何形状构成的静物等，表达忧郁的怀乡情绪。作有《形而上的缪斯》《夏》等。"], ["卡拉巴尔", "尼日利亚东南部港市，克罗斯河州(Cross)首府。位于卡拉巴尔河东岸。大市区人口46.7万（2015年)。15—19世纪西欧各国殖民者贩运奴隶的转运站。为橡胶、棕榈油、可可、木材的贸易、加工中心和出口港。近海渔业很盛。有渔产品加工、水泥、锯木、造船等工厂。传统手工艺品以乌木雕刻闻名。公路通东部主要城镇和邻国喀麦隆，有航空站。建有教会学校(1846年)、卡拉巴尔大学等。"], ["卡拉干达", "哈萨克斯坦中部城市，卡拉干达州首府。位于哈萨克丘陵北部。人口43.12万(2015年)。地处卡拉干达煤田区中心，20世纪30年代初随铁路通达和煤炭基地建设而兴起。1934年建市。工业以采煤、钢铁业为主，还有矿山机械、化工、水泥等。建有额尔齐斯-卡拉干达运河。分新、旧两城，旧城分散，包括20多个煤矿居民区；新城位于南部，为文化和行政中心。"], ["卡拉哈迪沙漠", "亦称“卡拉哈迪盆地”。非洲南部内陆干燥区的总称。北界赞比西河上源，南界奥兰治河，东起东经26°左右，西迄大西洋沿岸附近。南北最长处约1600千米，东西最宽约960千米，面积约93万平方千米。主要在博茨瓦纳、纳米比亚境内。大部为内陆盆地，海拔900\\~1100米。气候干燥，地面多干沟和黄色细沙。西部、北部有灌木和草本植物；南部以荒漠、半荒漠为主，沙丘散布。富金刚石、铜、铅、锌、钒等矿藏。西南部有卡拉哈迪大羚羊国家公园。"], ["卡拉汉", "(Leonard James Callaghan,1912—2005) 英国首相(1976—1979)。工党领袖。1945年起为下院议员。历任财政、内政、外交和联邦事务大臣。1976年任工党领袖，同年出任首相。1980年辞去工党领袖职务。1981年任伯明翰大学名誉评议员。著有《一个四分五裂的家庭：北爱尔兰问题的困境》等。"], ["卡拉季奇", "(Vuk StefanovićKaradžić，1787—1864)塞尔维亚作家、语言学家、教育家。曾建立学校、出版社、首批学会和剧院，搜集、整理出版许多民间文学作品，对塞尔维亚语成功地进行改革，有力推动塞尔维亚文学的发展。整理编辑《塞尔维亚民族诗选》《塞尔维亚民族谚语》《塞尔维亚民族小故事》。还是塞尔维亚语言学的奠基人，编撰了首部塞尔维亚语的语法书和词典。"], ["卡拉迦列", "(Ion Luca Caragiale,1852—1912)罗马尼亚剧作家、作家。生于流浪艺人家庭，做过报刊编辑、剧院经理等。写有8个剧本以及小说、政论。代表剧作《一封遗失的信》，揭露资产阶级政党在选举中玩弄的卑鄙手段。短篇小说《在战时》《罪恶》《一等奖》等，描写罗马尼亚小市民的生活，讽刺资产阶级政府的倒行逆施。因其作品触怒当局，1904年后流亡国外。还写有政论《1907，由春到秋》，抗议统治阶级镇压农民起义。后被追授罗马尼亚科学院名誉院士。"], ["卡拉胶", "亦称“角叉菜胶”。以角叉菜、麒麟菜、沙菜等红藻类为原料，经加碱提取、浓缩凝固、脱水干燥制成的胶质物。主要成分为多聚半乳糖的硫酸酯。作为增稠剂、凝固剂、稳定剂等，广泛用于食品工业和牙膏、化妆品等化学工业。"], ["卡拉卡尔帕克人", "() 乌兹别克斯坦民族。咸海南岸古代居民萨基-马萨格特人的后裔。约70.5万人(2011年)。主要分布在卡拉卡尔帕克，部分在费尔干纳等地。语言属阿尔泰语系突厥语族，有文字。信伊斯兰教，属逊尼派。从事畜牧业、农业和渔业。另有部分人在阿富汗。"], ["卡拉卡拉敕令", "公元212年罗马帝国皇帝卡拉卡拉(Caracalla，211—217年在位)颁布的敕令。卡拉卡拉为绰号，本名安敦尼努斯(Antoninus)，故又称《安敦尼努斯敕令》。规定除降人(dediticii)和奴隶外，予帝国境内全体自由居民以罗马公民权。旨在扩大帝国的统治基础，并增加税收来源。"], ["卡拉库尔羊", "羔皮用绵羊品种。原产乌兹别克斯坦卡拉库尔(Kp)。一般头稍长、耳大下垂。成年公羊大多有角，母羊多无角。被毛有黑、灰、棕、白、灰白和金、银等色，并随年龄增长而变化，除白色外，其他均变为不同程度的灰白色。尾肥大，长及飞节以下。成年公羊体重60\\~70千克，母羊45\\~50千克。耐粗饲，耐干旱，肉质优良。以羔皮花纹美观著称于世。"], ["卡拉库姆沙漠", "(KapaymI)突厥语意为“黑沙漠”。位于中亚南部土库曼斯坦境内。东西长880千米，南北宽450千米，面积约35万平方千米。多沙垄和新月形沙丘。大陆性干旱气候。1月平均气温-5\\~3℃,7月28\\~34℃；气温日较差达50℃。年降水量60\\~150毫米。沿阿姆等河有绿洲。低地多盐土和龟裂土。大部地区春季生长短草，可供放牧。矿藏有硫黄、石油和天然气。卡拉库姆运河流经南部，可灌溉、通航。"], ["卡拉马佐夫兄弟", "长篇小说。俄国陀思妥耶夫斯基作(1879—1880)。在作者托名为“畜栏”的小城市里，地主老卡拉马佐夫与长子德米特里为争夺情妇，以及争执财产，势不两立;次子伊凡是玩世不恭的犬儒主义者，与长兄之间又交织着另一种爱情纠葛；小儿子阿辽沙热情正直，为宣扬基督教的博爱而奔走；老卡拉马佐夫的私生子斯麦尔佳科夫利用他们父子之间的不和，残忍地谋杀了生父。最后，长子涉嫌入狱，次子神经错乱，小儿子弃家远游，私生子则自杀身亡。小说深刻地揭示了19世纪70年代俄国社会的丑恶面目和尖锐矛盾，同时也通过作者理想中的人物阿辽沙的形象，宣扬博爱精神和以道德改造社会的观点。"], ["卡拉姆津", "( ，1766—1826)俄国作家，历史学家。1803年起担任宫廷史官，专事历史研究。主要作品中篇小说《可怜的丽莎》，写一个农村少女被贵族遗弃而自杀的故事，充满感伤情调。所编《俄罗斯国家史》12卷，资料丰富，文笔清丽。"], ["卡拉齐兄弟", "洛多韦科·卡拉齐(LodovicoCarracci,1555—1619)及其堂弟阿果斯丁诺·卡拉齐(Agostino Carracci,1557—1602)、安尼巴莱·卡拉齐(AnnibaleCarracci，15601609)。意大利画家。主张用调和折中的方法学习文艺复兴盛期的遗产，在博洛尼亚开办美术学院，传播其主张和教学方法，形成了较严整的美术教育体系。其以宗教为题材的湿壁画和油画多为教会和贵族的需要服务。罗马法尔内塞宫的装饰壁画是安尼巴莱的代表作。"], ["卡拉奇", "(Karāchi)旧译“喀喇蚩”。巴基斯坦最大城市和最大经济中心，信德省(Sindh)首府。位于印度河三角洲西缘，南临阿拉伯海。人口1491万(2017年)。原为渔村，1845年筑港，1947—1959年曾为巴基斯坦首都。全国最大港口，为天然深水良港，码头分东西两部分，有驳船和油码头。有国际机场。全国大多数银行的总行所在地。工业产值居全国首位，有黄麻及棉纺织、造船、石油化工、电器、机械、钢铁等工业。有卡拉奇大学、国立博物馆及原子能研究所。还有真纳陵墓。"], ["卡拉恰伊人", "(Kapa)北高加索的民族。由北高加索西部的古代山民和后来的阿兰人、保加尔人等长期结合而成。约15.6万人(2001年)。分布在俄罗斯卡拉恰伊-切尔克斯共和国及中亚。语言属阿尔泰语系突厥语族，有文字。信伊斯兰教，多属逊尼派。主要从事游牧业，兼事农业和手工业。"], ["卡拉-乔治", "(Karadorde,1768—1817)塞尔维亚卡拉-乔治维奇王朝的创立者。出身农民，早年参加过奥土战争和农民起义。1804年塞尔维亚爆发反土起义，被推为领袖，此后曾与俄国结盟，共同对土作战。在国内推行改革，颁布第一部宪法，成为最高世袭君主，由此创建卡拉-乔治维奇王朝。1813年因对土战争失败和内部纷争逃往国外。1817年回国，不久遇害。"], ["卡拉斯", "(Maria Callas，1923—1977) 美国女高音歌唱家。原名玛丽亚·卡洛耶罗普洛斯(MariaKalogeropoulos)。原籍希腊。13岁入雅典音乐学院。1938年在雅典皇家歌剧院首次登台，扮演《乡村骑士》中的桑图扎。1945年去纽约。1947年应邀在意大利维罗纳演出彭吉埃里(Amilcare Ponchielli,1834—1886)的歌剧《歌女》。后长期在意、英、美、法等国演出。擅演19世纪早期的意大利歌剧。嗓音清亮宽厚，舞台动作洗练优美。毕生演出歌剧40余部，灌录有20余部完整歌剧的唱片。"], ["卡拉斯基利亚", "(Tomás Carrasquilla，1858—1940)哥伦比亚小说家。曾在大学学习法律。1934年双目失明后以口授方式继续创作。以现实主义手法描绘广阔的社会场景，对资本主义提出尖锐批评。善于运用山区方言。长篇小说《我故乡的果实》，反映安蒂奥基亚山民的生活。还写有历史小说《约隆博侯爵夫人》，短篇小说集《孩子的内心》《超人利希亚·克鲁斯》等。"], ["卡拉苏克文化", "俄罗斯西伯利亚南部青铜时代的一种文化。年代约为公元前2000一前1000年。最初发现于米努辛斯克()附近的卡拉苏克河()畔，故名。属母系氏族社会向父系氏族社会过渡阶段。经济生活以畜牧业为主。典型器物有青铜曲柄刀和弓形铜器等。与中国商周时代文化似有关系。"], ["卡拉瓦乔", "(Michelangelo Merisi da Caravaggio,1571—1610)意大利画家。从米兰画家培德查诺(SimonePeterzano,1540—1596)学画，并受威尼斯画派的影响。初期多作风俗画及静物画，后倡导以宗教改革者的批判精神来处理宗教题材。擅长运用强光黑影突出主要物体，删除繁琐的细节描绘，具有刚劲的风格，成为对抗卡拉齐兄弟学院派的重要力量。作有《女卜者》《马太的神召》《耶稣之葬》《酒神》《弹曼陀林的女郎》等。"], ["卡拉维洛夫", "( ， 18341879)保加利亚作家、思想家。1857—1866年旅居莫斯科，1869年旅居布加勒斯特，次年参加创建保加利亚革命中央委员会，并先后担任该委员会机关报《自由》与《独立》的主编。1875年脱离政治活动。在哲学上，认为物质不依赖于人的意识而客观地存在，感觉器官是人们认识外部世界的必经之路，但又认为理性与科学是历史的动力。写有小说、诗歌和政论等。中篇小说《旧日的保加利亚人》《痛苦的命运》等，主要反映保加利亚人民在土耳其统治下的痛苦处境。"], ["卡拉扬", "(Herbert von Karajan， 1908—1989)奥地利指挥家。早年入维也纳音乐学校及萨尔茨堡莫扎特纪念馆学习音乐。1929年起先后在乌尔姆歌剧院、亚琛歌剧院任指挥。1938—1945年领导柏林歌剧院。1947年起任维也纳爱乐乐团指挥、维也纳国家歌剧院艺术指导。翌年兼英国伦敦爱乐乐团常任指挥。1955年任柏林爱乐乐团终身常任指挥。其指挥艺术继承并发展托斯卡尼尼的传统，在忠于原作的基础上，赋予作品以丰富的色彩和层次。擅长指挥莫扎特、贝多芬、瓦格纳、布鲁克纳和理查·施特劳斯等人的交响作品和歌剧，对20世纪的指挥艺术有重要影响。"], ["卡拉OK", "源自日本的娱乐性质歌唱活动。名称系日语外来语，“卡拉”是“空”（空无)之意，“OK”则是“管弦乐团”的简称，合起来意指唱歌时无真正的乐队伴奏，只有影音伴奏。1971年井上大佑(1940—)发明了最早的音乐伴唱带。现通常是在播放预录在录像带之类储存媒介上、没有主唱人声的音乐伴奏同时，在电视屏幕上同步播放有着节拍提示的歌词，然后由参与者边看着歌词边持麦克风唱歌。"], ["卡莱尔", "(Thomas Carlyle,1795—1881)英国作家、历史学家。就读于爱丁堡大学，因贫辍学。曾参加宪章运动。著有《法国革命史》《过去与现在》《宪章运动》《旧衣新裁》等。《论英雄与英雄崇拜》为“英雄史观”的代表作。后期撰写《腓特烈大帝传》，颂扬普鲁士军国主义。"], ["卡莱斯基", "(Michal Kalecki,1899—1970)波兰经济学家。早期曾受马克思主义政治经济学的启蒙教育，20世纪30年代初独立地先于凯恩斯的《就业、利息和货币通论》一书提出了有关的主要观点。曾去英国一些大学工作，并先后在联合国秘书处及波兰政府中任职。晚年致力于动态经济学和社会主义经济增长的研究。1957年被选为波兰科学院通讯院士，1966年为院士。主要著作有《经济波动理论文集》《动态经济学研究》《社会主义与混合经济的经济增长论文集》等。"], ["卡勒瓦拉", "(Kalevala) 亦译《英雄国》。芬兰民族史诗。原为中世纪芬兰口头流传的民间歌曲，包含许多古代神话和传说，后用文字记录下来。1835年由伦罗特搜集整理出版，1849年又出版增订本，有叙事诗50首，共 22 795行。描写卡勒瓦拉(意为卡累利阿人的土地)的英雄们和北方氏族波约拉争夺“三宝”(制造谷物、盐和金币的三个神磨)的故事，反映了芬兰人民在氏族社会瓦解时期的生活和思想。主人公大多是劳动人民。对芬兰诗歌的发展有巨大的影响。"], ["卡累利人", "(Kape)旧译“卡累利阿人”。俄罗斯联邦民族。由10世纪前后住在拉多加湖和奥涅加湖地区的维普斯人、北部的萨阿米人，并吸收斯拉夫人成分，长期结合而成。约15万人(2001年)。分布在卡累利阿共和国和特维尔州。语言属乌拉尔语系芬兰-乌戈尔语族。信俄罗斯正教。主要从事工农业。"], ["卡雷尔", "(AlexisCarrel,1873—1944)法国外科学家。里昂大学医学博士，长期在美国工作。在研究血管缝合、血管与器官移植方面作出开创性贡献，获1912年诺贝尔生理学或医学奖。创制出世界上第一个帮助病人呼吸的铁肺(现存于北京协和医院)。"], ["卡里阿斯和约", "公元前449年结束希波战争的和约，订于波斯首都苏萨。因雅典代表卡里阿斯(Callias或Kallias)而得名。规定：波斯放弃对爱琴海及赫勒斯滂地区的控制权，承认小亚细亚各希腊城邦独立。"], ["卡里马科斯", "卡里马科斯(Callimachos，约前305—约前240)古希腊学者，诗人。初在亚历山大城城郊讲学，后任职亚历山大城图书馆，将当时所藏全部图书整理编目，奠定了研究希腊文学的基础。据称作品近800篇，代表作为哀歌体诗集《起源》4卷，阐释风俗、节庆和名称的起源。对罗马诗歌创作影响很大。现存完整作品不多。"], ["卡里莫", "卡里莫( ，1938—2016) 乌兹别克斯坦总统(1991—2016)。1964年加入苏联共产党。1966年起长期在苏联乌兹别克计划委员会工作。1983年担任乌兹别克财政部长，1986年担任乌兹别克部长会议副主席兼国家计划委员会主席。1989年6月担任乌兹别克共产党中央第一书记。1990年当选乌兹别克总统。1991年8月31日宣布乌兹别克独立。苏联解体后，当选乌兹别克斯坦总统，并数次获得连任。"], ["卡利", "卡利(Cali) 哥伦比亚西部城市,考卡山谷省(Valle del Cauca)首府。位于南部考卡河支流卡利河两岸。海拔1014米，气候宜人。市区人口235.83万，大都市区人口294.36万(2016年)。始建于1536年。交通枢纽，铁路和公路通太平洋岸要港布埃纳文图拉。有国际机场。考卡河上游甘蔗、烟草、咖啡和牲畜的集散地。商业发达。有纺织、橡胶、冶金、机器制造、造纸、化工和食品等工业。宗教、文化中心，有大学、大教堂、博物馆等。"], ["卡利加里博士", "卡利加里博士亦译《卡利加里博士的小屋》。德国故事片。闪电影业公司1920年出品。雅诺维茨(Hans Janowitz,1890—1954)与梅育编剧。维内（RobertWiene，1873—1938)导演。伐德特(ConradVeidt，1893—1943)和克劳斯(Werner Krauss，1884—1959）主演。精神病院院长卡利加里博士对青年舍扎尔施行催眠术后，把他作为在集市上供人观看的玩物，并驱使他夜间去杀人。舍扎尔终因耗尽精力而亡。卡利加里的阴谋败露后被当作疯子关进疯人院。影片刻意描写残忍、急躁、幻想和疯狂的心理，风格怪异奇特，被认为是德国表现主义影片的代表作之一。"], ["卡利卡特", "卡利卡特(Calicut)旧称“科泽科德”(Kozhikode)。印度西南部喀拉拉邦港市。临阿拉伯海。人口43.2万(2011年)。公元7世纪即为印度和阿拉伯人贸易中心。古代以手工织布业著名，17世纪初印度输往英国的棉布多由此出口，棉布也因此称为“卡利科布”(Calico)。附近盛产椰子、咖啡等。有椰子纤维加工、椰油制造、纺织、锯木、塑料等工业。"], ["卡林尼科夫", "卡林尼科夫(-KOB，1866—1901) 俄国作曲家。1885年入莫斯科爱乐协会音乐-戏剧学校。作品质朴、抒情，富于俄罗斯风味。代表作《g小调第一交响曲》流传甚广。另有《A大调第二交响曲》、交响音画《雪松与棕榈》、仅完成序幕的歌剧《一八一二年》、康塔塔《大马士革的约翰》，及为阿·托尔斯泰的悲剧《沙皇波利斯》所作的配乐等。"], ["卡龙", "卡龙拨奏弦鸣乐器。13世纪由中亚传入，称“七十二弦琵琶”。清代称“喀尔奈”，归入宫廷宴乐回部乐。流传于新疆南部麦盖提、喀什、和田等地。为十二木卡姆的主要乐器。用拨子弹奏。"], ["卡隆", "卡隆(Charon)希腊神话中的冥界渡船夫。谓每一亡灵渡河时，须付其一枚银币，因此按照古希腊风俗，死者口中应放钱币一枚，作为渡资。"], ["卡鲁索", "卡鲁索(Enrico Caruso,1873—1921)意大利男高音歌唱家、歌剧演员。生于工人家庭。1894年开始舞台生涯，1898年在米兰扮演《菲杜拉》剧中的罗列斯·伊巴诺夫伯爵获得成功而声名日盛。1902年至美国纽约大都会歌剧院演出，后任该院首席男高音至1920年。嗓音洪亮，呼吸控制技术高超。以善演威尔第、普契尼、梅耶贝尔等人的歌剧著称。毕生演出歌剧50余部，灌录有历史上第一张歌唱唱片。著有《歌唱法》一书。"], ["卡伦津人", "卡伦津人(Kalenjin)肯尼亚的民族。尼洛特人的南支，中世纪自埃塞俄比亚和苏丹交界地区迁入。约541万人(2012年)。主要分布在肯尼亚西部(516万人)，另有少数分布在坦桑尼亚北部(25万人，亦称“塔托格人”)。语言属尼罗-撒哈拉语系沙里-尼罗语族。多持传统信仰，崇拜祖先和自然力。从事农牧业，饲养牛羊。"], ["卡罗尔", "卡罗尔(Lewis Carroll,1832—1898)英国童话作家。原名查尔斯·勒特威奇·道奇生(Charles Lutwidge Dodgson)。毕业于牛津大学，做过牧师和数学讲师。所作童话《爱丽丝漫游奇境记》和《镜中世界》等，通过虚幻离奇的情节，嘲讽19世纪后期英国的社会现象，流传很广。"], ["卡罗尔一世", "卡罗尔一世(CarolI,1839—1914) 罗马尼亚大公(1866—1881）、国王（1881—1914)。被拥立为大公后，重视开发产业，发展教育。参加俄土战争。1878年罗马尼亚脱离土耳其独立，1881年成立王国。力图巩固君主立宪制度。1883年加入奥匈、德、意三国联盟。第一次世界大战爆发后企图参加德方作战，遭反对未果。"], ["卡罗瑟斯", "(Wallace Hume Carothers,1896—1937)美国化学家。曾在伊利诺伊大学、哈佛大学、杜邦公司任教和从事研究工作。美国全国科学院院士。1931年合成氯丁橡胶。1937年发明用熔融法制造第一个聚酰胺纤维品种——聚酰胺66，次年形成工业化生产，奠定合成纤维工业基础。"], ["卡罗维发利", "(Karlovy Vary)捷克西部城市，属卡罗维发利州。地处奥赫热河(Ohře)畔，东距布拉格113千米。人口4.90万(2017年)。建于1349年。矿泉疗养地，矿泉水富含多种矿物质，供饮用、沐浴和治病。以生产瓷器和精制玻璃品著称。有精制玻璃博物馆。有15—18世纪古迹。1950年起在此举办国际电影节。"], ["卡罗维发利国际电影节", "国际电影节。捷克斯洛伐克1946年创办。1993年起由捷克主办。第一至第四届在马里亚温泉市举行。第五届起移至卡罗维发利，故名。每年67月举行，为期两周。1953年和1955年停办，1959—1993年改为两年举办一次。1948年起设水晶地球仪奖。"], ["卡洛琳斯卡学院", "瑞典公立医科大学。1810年创立于斯德哥尔摩市郊的索尔纳市(Solna)。为纪念瑞典国王卡尔十一世(KarlXI,1660—1697年在位)和卡尔十二世的亲军“卡洛林步兵”而命名。除设有传统的外科、儿科、内科等系科外，还设有社会医学、神经心理学、公共卫生与健康等系科，并设有评审和颁发诺贝尔生理学或医学奖委员会。"], ["卡洛米里斯", "(Manolis Kalomóirēs，1883—1962)希腊作曲家、钢琴家。学于奥地利维也纳音乐学院。1906年起，曾在俄国乌克兰哈尔科夫任教4年。归国后任雅典音乐学院教授及该院院长。1926年创办民族音乐学院并任院长。作有歌剧5部、交响曲3部、管弦乐《希腊组曲》，以及钢琴协奏曲、小提琴小协奏曲、合唱曲、室内乐等。其歌剧《老工匠》，是希腊第一部民族歌剧。"], ["卡洛斯·布洛山", "(Calos Bulosan，1915—1956)菲律宾小说家、诗人。生于贫苦农民家庭。中学辍学后去美国。根据菲律宾民间传说写作讽刺小品，笔调清新。还著有自传体小说《美国在心中》和诗集《美国书简》《巴达安之声》等。"], ["卡马圭", "(Camagüey)古巴中东部城市，卡马圭省首府。人口30.47万(2015年)。1528年建城。随20世纪铁路和公路兴建而发展。内地农牧产品的集散地和加工中心。有全国最大的铁路车辆厂，还有有色冶金、肉类加工、制革、制糖、烟草等工业。附近有铬、锰、铁矿。重要铁路枢纽，设国际机场。市内多古老教堂。"], ["卡·马克思《1848年至1850年的法兰西阶级斗争》一书导言", "恩格斯写于1895年2月14日至3月6日。编入《马克思恩格斯全集》第1版第22卷、《马克思恩格斯文集》第4卷、《马克思恩格斯选集》第2、3版第4卷。恩格斯研究了19世纪下半期欧洲资本主义发展的新情况，总结了欧洲工人运动的新经验，发展了马克思主义的革命斗争策略思想。指出1848年欧洲经济发展状况远没有成熟到可以铲除资本主义生产的程度，他和马克思当时提出的无产阶级伟大决战已经开始的估计不符合实际，旧的斗争策略需要修改。强调无产阶级革命只能是真正大多数人的革命，必须进行长期坚持不懈的工作，使群众懂得为什么流血牺牲。根据巴黎公社以后资本主义国家经济政治生活的新变化，阐明了利用资产阶级民主和普选权的重要意义，充分肯定了德国社会民主党在这方面取得的成就，指出普选权在德国工人那里由历来是欺骗的手段变成了解放的手段，应当利用普选权这一合法斗争形式为未来的决战积蓄和准备力量。同时告诫无产阶级，尽管利用这种合法手段取得了巨大成就，但决不能放弃自己的革命权，“革命权总是唯一的真正历史权利’”。《导言》的思想曾被机会主义者歪曲为放弃革命暴力，恩格斯在世时就给予了驳斥。"], ["卡迈尔", "(Mustafā Kāmil,1874—1908)亦译“迦米尔”。埃及民族运动领袖、政论家。1900年创办《旗帜报》，1907年组织新祖国党。反对英国殖民统治，主张独立和改革。"], ["卡门", "歌剧。法国作曲家比才作曲。梅亚克（HenriMeilhac，1830—1897)、哈列维(Ludovic Halévy,1834—1908)据梅里美的同名小说撰写脚本。1875年首演于巴黎喜歌剧院。4幕。原为带说白的法国喜歌剧体裁，后由吉罗(Ernest Guiraud,1837—1892)将对话部分谱成宣叙调。剧情为：吉卜赛烟草女工卡门(Carmen)诱惑龙骑兵班长唐霍赛，使其堕入情网，成为走私贩，后因不愿受唐霍赛约束，与斗牛士埃斯卡米洛相爱，终被唐霍赛手刃而死。刻画了卡门热情泼辣、酷爱自由的性格特点;音乐多用舞蹈歌曲及分节歌，具有强烈的戏剧性和西班牙色彩。是比才最后一部歌剧作品，也是世界上上演率最高的一部歌剧。"], ["卡门涡街", "定常来流绕过物体时，在一定条件下物体两侧周期性地出现旋转方向相反且有规律排列的两列线涡。因冯·卡门最先对流体绕圆柱流动的尾流区中发生的这种现象作了深入分析，故名。"], ["卡蒙斯", "(Luís Vazde Camões，约1524—1580)亦译“贾梅士”。葡萄牙诗人、剧作家。曾在王宫中生活多年。后服役去非洲、印度等地，在战争中失去右眼。所作史诗《卢济塔尼亚人之歌》，共10章，长达8800多行，描写葡萄牙航海家达·伽马远航印度的经过，有浪漫主义色彩。还写有剧本《宴会主人》《国王塞寮古》《菲洛德莫》等，以及300多首十四行诗、哀歌和讽刺诗。"], ["卡米拉罗依人", "(Kamilarois)澳大利亚原住民部落之一。1788年英国殖民者侵入以前，分布在澳大利亚东南部达令河流域。保存有初期氏族公社。后受到殖民者的屠杀和压迫，到20世纪中叶已灭绝。"], ["卡明斯", "(Edward Estlin Cummings,1894—1962)美国诗人、小说家。毕业于哈佛大学。第一次世界大战期间在救护部队服役，因被误控为“叛国罪”而遭监禁，后根据这一经历写成小说《大房间》，用讽刺手法揭露监狱中的暴行。战后一度侨居巴黎，创作诗歌和绘画。1923—1944年间发表《郁金香和烟囱》等诗集，作品在主题、语言和印刷排版等方面都别具一格，被称为“现代巴洛克式风格”“大胆的现代主义手法”。诗的主题多为爱情，以及对政治家、企业家和商人的讽刺，对下层人民的同情，但也带有逃避现实和虚无主义的思想倾向。"], ["卡末林-昂内斯", "(Heike KamerlinghOnnes,1853—1926)荷兰物理学家。格罗宁根大学哲学博士。莱顿大学教授。长期从事低温下物体性质的研究，获取接近于热力学温度1开的低温，实现氢和氦的液化，发现超导性，由此而获1913年诺贝尔物理学奖。在热力学、磁光学等方面都有一定贡献。"], ["卡那卡那富语", "中国台湾省卡那卡那富人使用的语言。属南岛语系印度尼西亚语族台湾语支邹语群。卡那卡那富人是高山族的一支，分布在台湾高雄县三民乡，该语已趋于消亡。大多是多音节词，前加成分比较丰富，多音节词重音一般落在倒数第二个音节上。名词、代词有格的语法范畴。动词有体、态、式等语法范畴。语序是谓语一主语一宾语。词根附加成分和词根的重叠是构词与构形的主要手段。"], ["卡那霉素", "(kanamycin)化学式C18H38N4O11。氨基糖苷类抗生素。由卡那链丝菌培养液提得。对多种革兰氏阴性菌、阳性菌及结核杆菌等都有抗菌作用。由于其毒性及耐药性较多见，已不作为细菌感染的首选药，也很少用于结核病的治疗。口服可作为腹部术前的肠道消毒。可引起肾脏损害和听觉障碍。"], ["卡纳达人", "(Kannadas)自称“卡纳季加人”，亦称“坎纳拉人”。印度民族。约4602万人(2011年)。主要分布在卡纳塔克邦(Karnātaka)，其余在邻近各邦。语言属达罗毗荼语系。多信印度教，少数信伊斯兰教和天主教。主要从事农业。另有近3万人在新加坡。"], ["卡纳克神庙", "古埃及底比斯的阿蒙神庙。遗址在今埃及中部尼罗河东岸的卡纳克(Karnak，亦译“凯尔奈克”)。始建于中王国，新王国(第十八至二十王朝)时期的多数法老都在这里大兴土木，后统治者都有建筑增添。系一综合性巨大建筑群，可分为阿蒙神庙、穆特(阿蒙神的配偶)神庙和孔斯(阿蒙神和穆特之子）神庙三部分。其著名殿堂占地约5000平方米，顶由134根圆柱支撑，中间12根最大，每根高达24米，据说柱顶可站立百人。"], ["卡纳维拉尔角", "(CapeCanaveral)1963—1973年曾名“肯尼迪角”(Kennedy Point)。美国佛罗里达半岛东部的凸出部分，东濒大西洋，与大陆之间隔狭长潟湖。肯尼迪航天中心所在地。1962年设卡纳维拉尔角市。人口10352人(2016年)。"], ["卡南加", "(Kananga)旧称“卢卢阿布尔”(Luluabourg)。刚果(金)中南部城市，西开赛省(Kasai Occidental)首府。人口127.2万(2015年)。地处刚果盆地南缘宽果(Kwango)高原。中南部重要工矿、商业中心，农畜产品集散地。附近的姆布吉马伊(Mbuji-Mayi)与奇卡帕(Tshikapa)为世界著名的工业用金刚石矿开采区。有纺织、榨油、面粉、锯木、制药等工业。公路通国内主要城镇，有航空站。"], ["卡内蒂", "(Elias Canetti,1905—1994)英国德语作家。生于保加利亚，西班牙犹太人后裔。1929年获维也纳大学化学博士学位。1938年迁居伦敦，并入英国籍。代表作长篇小说《迷惘》通过一个个畸形、怪诞的人物，描绘了一个令人触目惊心的疯狂世界，反映了资本主义社会中精神、信仰与物欲之间的冲突。剧作《婚礼》《虚荣的喜剧》和《确定了死期的人们》揭露了人们的贪婪、自私、放纵和生活中的不安全感。还写有政论《群众与权力》、杂文集《良心话》，以及自传三部曲《得救的舌头》《耳中火炬》和《眼波的游戏》。获1981年诺贝尔文学奖。"], ["卡尼鄂拉蜂", "(Apis melliferacarnica)亦称“喀尼阿兰蜂”。西方蜜蜂的一个亚种，为欧洲四大著名蜜蜂亚种之一。原产阿尔卑斯山南部和巴尔干半岛北部。外形与意大利蜜蜂相似，为灰色蜂种。性温驯，采集力、定向力、抗幼虫病和越冬性均强；盗性弱；对气候变化敏感，分蜂性强。中国各地有零星饲养。"], ["卡农", "英语canon的音译。复调音乐创作技法之一。其特点为：同一旋律以相同或不同的音高在各声部先后出现，后面声部按一定的时距依次模仿前一声部。以此写成的乐曲称“卡农曲”。根据模仿方式不同，有定格与变格之分；前者应句形态须与主句一致，而后者则可有时值、方向等变化，如扩大卡农、缩小卡农、倒影卡农及逆行卡农等。准确模仿的卡农称严格卡农，变化模仿的卡农称自由卡农。"], ["卡努多斯农民战争", "巴西巴伊亚州农民争取土地的武装起义。1893年自称“上帝使者”的马西埃尔(Antônio Vicente Mendes Maciel,1828—1897)以废债抗税为口号，借宗教信仰，在卡努多斯村(Canudos)建立村社，实行土地公有制，吸引农民数千人。1896年11月起义，多次击败政府军。次年10月被镇压。"], ["卡努里人", "(Kanuri)西非地区跨界民族。约630万人(2001年)。分布在尼日利亚、尼日尔和乍得等国。语言属尼罗-撒哈拉语系撒哈拉语族。多信伊斯兰教。主要从事农牧业，部分从事手工业。"], ["卡诺", "①(Kano)。尼日利亚北部城市，卡诺州首府。位于哈代贾河(Hadejia)上游。大市区人口358.7万(2015年)。1015世纪曾为豪萨人部落王国都城，19世纪起为富拉尼部落城邦国家首邑。北部工商业重镇。有纺织、榨油(花生)、皮革、食品加工、卷烟、水泥、汽车装配、轧钢等工业。传统手工业有装饰品、席编、制陶等。公路网中心，铁路通拉各斯与哈科特港，有国际航空站。有巴耶罗大学、农业研究所等。多豪萨人的古宫殿、清真寺等古迹，还有珍藏古代手工艺品的博物馆。旅游避暑胜地。②尼古拉·莱奥纳·萨迪·卡诺(Nicolas Léonard SadiCarnot,1796—1832)。法国物理学家、工程师。毕业于巴黎综合理工大学。1824年提出了卡诺循环和卡诺定理，是以后建立热力学第二定律的重要基础。"], ["卡诺定理", "法国卡诺在1824年首先提出的关于热机效率的定理。其内容可表述为：所有工作于两个给定温度之间的热机中，以可逆卡诺机的效率为最大。从卡诺定理还可推得如下结论：所有工作于两个给定温度之间的可逆机，其效率相等。"], ["卡诺莎之行", "亦称“卡诺莎觐见”。西欧中世纪时神权和皇权争斗的事件。卡诺莎(Canossa)为意大利北部的古城堡(今雷焦[Reggio]附近卡诺莎村)。神圣罗马帝国皇帝亨利四世同教皇格列高利七世争夺主教叙任权，前者被教皇开除教籍并废黜帝位，帝国诸侯纷纷叛离。1077年1月亨利冒着风雪严寒，来到教皇驻地卡诺莎表示“悔罪”。据说亨利身着罪衣，立于城堡门口哀求三昼夜，始得教皇赦免。后来“卡诺莎之行”便成为屈辱投降的同义语。"], ["卡诺图", "亦称“最小项方格图”。一种用几何图形方法化简逻辑函数的平面方格图。由美国科学家卡诺(MauriceKarnaugh,1924—)设计。具有简便直观、容易掌握等优点，用它化简逻辑函数可快速得到最简的结果。缺点是当变量个数大于5以后，上述优点都丧失，一般不再使用。"], ["卡诺循环", "热力学中理想的热力循环。因法国卡诺于1824年首先提出而得名。由四个过程组成：（1）定温加热，工质的容积膨胀；(2)绝热膨胀，工质的温度降低；(3)定温放热，工质的容积压缩；(4)绝热压缩，工质的温度升高，并回到开始时的状态，完成一个循环。一切热力循环在上下限热力学温度T和T2相同的条件下，卡诺循环的热效率最高。卡诺循环热效率公式η =1-T2/T1指出了一切热机提高热效率的方向。"], ["卡帕藻", "(Kappaphycus) 红藻纲，红翎菜科。藻体肥厚多肉，简单钝形或渐狭圆锥形，无紧密假根轴。生于低潮线下0.5\\~6米深处。中国海南已有规模化人工栽培。本属有长心卡帕藻(K.alvarezii)、耳突卡帕藻（K.cottonii)、异枝卡帕藻(K.striatum)。长心卡帕藻由菲律宾引进海南栽培，异枝卡帕藻产于中国海南省。莫桑比克、印度尼西亚、马来西亚、菲律宾、密克罗尼西亚群岛均有分布。主要作为K-型卡拉胶原料，用于食品、轻工业等方面。"], ["卡佩王朝", "法国王朝(987—1328)。因西法兰克王国加洛林王朝绝嗣，法兰西亚公爵休·卡佩(HuguesCapet，约940—996)当选国王，王朝因以得名。初时，王权软弱，大封建主割据称雄，王室统治仅限于王室直属领地范围。12世纪起争取市民、中小封建主支持，兼并封建领地，改革司法、财政，加强王权。1302年首次召开“三级会议”，正式形成封建等级君主制。后为瓦罗亚王朝取代。"], ["卡彭铁尔", "(Alejo Carpentier，1904—1980)古巴小说家，音乐学家。曾参加创办古巴先锋派文艺杂志《前进》。1927年因反对独裁统治，被捕入狱。出狱后流亡国外。1959年回国，任国家出版社社长、驻法使馆文化参赞等职。所作长篇小说《消逝的脚步》刻画受西方文明冲击的美洲现实，《这个世界的王国》用魔幻现实主义手法反映18世纪海地革命和人民对自由的向往，《埃古-扬巴-奥!》揭示古巴艺术和生活中的非洲因素，《启蒙世纪》描写法国大革命时期西印度群岛发生的事件，《方法的根源》讽刺和抨击独裁者及其残暴统治。被认为是拉丁美洲现代小说的先驱。还有论著《古巴的音乐》《拉丁美洲的文学和政治意识》等。获1977年塞万提斯奖。"], ["卡皮查", "( ， 18941984)亦译“卡皮察”。苏联物理学家。1921年去英国。剑桥大学博士。曾为卢瑟福助手，剑桥大学三一学院研究员。1934年回国。创建苏联科学院物理问题研究所并任所长，莫斯科大学及莫斯科物理技术学院教授。英国皇家学会会员，苏联科学院院士。主要从事低温物理学的基础研究，解决氦液化的技术问题，并通过液态氦获得低温，发现液氦的超流性。因此和另外两人共获1978年诺贝尔物理学奖。还作磁学研究，获强度达4×10安/米的强磁场，用以证明塞曼效应和帕邢-巴克(Paschen-Back)效应，并进行了铋的磁阻、磁致伸缩及产生高频强电磁波等问题的研究。著有《大功率电子学》《实验、理论、实践》《卡皮查论文集》等，主编《实验物理学和理论物理学》期刊。"], ["卡普", "恩斯特·卡普(ErnstKapp,1808—1896)。德国哲学家，技术哲学奠基人。1830年获波恩大学历史学博士学位。率先使用“技术哲学”一词，着力从哲学的角度研究技术。把技术视为文化、道德和知识进步以及人类“自我拯救”的手段。提出“器官投影说”，认为工具和器物是人体器官的投影(模仿与延伸)，人是通过制造工具而不断地创造自己的。试图通过技术文化的工具发生历程来解释人类文化的演化历史。主要著作有《比较地理学》《技术哲学纲要》等。②朝鲜无产阶级艺术家同盟，简称KAPF。1925年8月由朝鲜无产阶级作家和艺术家组成。1927年、1931年两次改变理念方向，斗争意识日益强化。1935年被日本帝国主义强迫解散。对推动朝鲜文学理论和批评的发展作出了重要贡献。"], ["卡普安纳", "(Luigi Capuana,1839—1915)意大利文学理论家、作家。早年在卡塔尼亚大学攻读法律。曾任佛罗伦萨《民族报》戏剧评论员。1880年和维尔加一起发表真实主义宣言。主要作品有长篇小说《嘉琴达》与短篇小说集《乡村妇女》等。"], ["卡普暴动", "1920年3月13—17日德国德意志祖国党人卡普(WolfgangKapp,1858—1922)策动的政变。企图推翻魏玛共和国政府，恢复君主制。在鲁登道夫等人支持下，暴动分子占领柏林的政府大厦，驱走国会和政府成员，宣布成立以卡普为首的“政府”。柏林及各地工人发动罢工和武装起义，粉碎了暴动。卡普逃亡国外。"], ["卡普尔", "(Prithviraj Kapoor,1906—1972)印度电影、戏剧演员，电影企业家。生于旁遮普邦。早年从事舞台剧表演并创建普里特维·拉兹剧团。后进入电影界，成为印度无声电影时期有影响的演员。同时兼营影片生产和放映。一生拍摄影片60余部。其三子均从事电影拍摄，其中拉兹·卡普尔(RajKapoor，1924—1988)影响较大，父子曾合作拍摄影片《流浪者》。"], ["卡普拉", "(Frank Capra,1897—1991)美国电影导演。生于意大利西西里。1903年随家移居美国。后毕业于加利福尼亚技术学院。1921年起编写电影剧本。1928年起拍摄影片。因执导影片《一夜风流》、《第兹先生进城》(亦译《富贵浮云》)、《你不能夺去别人的幸福》(亦译《浮生若梦》)，三次获奥斯卡最佳导演奖。第二次世界大战期间在军队服役，拍摄军事系列片《我们为什么而战》，其中《大战前奏曲》获奥斯卡最佳纪录片奖。重要作品还有被称为“怪人喜剧”的《史密斯先生到华盛顿》(亦译《民主万岁》)、《这是约翰陀》(亦译《教授除奸》)、《美好的生活》等。其创作是好莱坞经典喜剧的代表。"], ["卡普钦斯基", "(Ryszard Kapuściński，1932—2007)波兰记者、报告文学作家。毕业于华沙大学历史系。曾担任多种刊物的记者以及波兰通讯社驻外记者。亲身经历许多国家发生的战乱和重要历史事件。撰写新闻报道时，时常加入主观经验和思考，甚至进行文学化的加工，尝试创造一种独特的文学形式。主要作品有报告文学《皇帝：一个独裁政权的颠覆》《帝国》《与希罗多德一起旅行》等。"], ["卡普坦", "(Jacobus Cornelius Kapteyn,1851—1922)荷兰天文学家。乌得勒支大学博士。任莱顿大学天文台观测员、格罗宁根大学教授。英国皇家学会会员、荷兰皇家科学院院士。研究银河系构造和恒星运动，提出“两星流”(实际为银河系较差自转的反映)学说和银河系的一种模型。与好望角天文台的天文学家合作，编制包含45万余颗星的《好望角照相巡天星表》，成为20世纪50年代前的南天标准星表。"], ["卡齐米", "(Abd al-Muhsinal-Kāzimī，1865—1935)伊拉克诗人。20世纪初移居埃及。主张阿拉伯国家复兴，消除殖民制度的不良影响，作品大多流露对祖国命运的担忧。主要作品有《卡齐米悬诗》《加尼亚》等。"], ["卡其", "英语khaki的音译。出自乌尔都语，意即“泥土”。有三种含义：(1）颜色名。军用布上染的类似泥土的保护色。(2)染料名。可染成类似泥土的黄棕色的各种染料，如士林卡其、硫化卡其等。早期用于将棉布染成卡其色的矿物质(如铁盐、铬盐)，称“矿物卡其”。(3)织物名。纹路明显的厚实斜纹布。有单面卡、双面卡、纱卡、线卡之分。结构紧密，经纱密度特别大。染整时多经过丝光。除染成土黄色外，还可有灰、蓝等色。多用于制作服装。"], ["卡契尼", "(Giulio Caccini,约1546—1618)意大利作曲家、歌唱家。少时学歌唱及琉特。1600年前后，在佛罗伦萨参加以贵族巴尔第(Giovanni Bardi，1534—1612)为首的人文主义者文艺聚会。在文艺复兴思潮影响下，摆脱当时流于僵化的声乐复调的束缚，致力于创作主调风格的吟诵式歌调。所作歌剧《尤丽狄茜》（成稿于1600年)是欧洲第一部歌剧:牧歌集《新音乐》(1602年出版)为世俗性主调风格独唱歌曲较早的重要作品，其序言及唱法说明，是有关宣叙调及美声唱法的重要历史资料。"], ["卡雀哇", "独龙族传统节日。时间由各家族或各村寨自定，多于头年腊月底或次年正月初择吉日举行，节期三天。其间除举行祭祀活动外，还有射弩箭、跳舞、聚会共餐等。"], ["卡人", "泰人对老挝山区土著人的通称。在老挝部分地区称“老听人”。20余万人(2012年)。分布在波罗芬高原，故亦称“波罗芬人”。语言属南亚语系孟-高棉语族。信小乘佛教，亦信万物有灵。主要从事农牧业，也有渔业。19世纪末起退居山腰或森林地区。另有在越南、柬埔寨等地，少数在泰国。在越南的称“摩伊人”，在柬埔寨的称“普农人”。"], ["卡日曲", "“卡日”，藏语意为“铜色”。黄河上源之一。在青海省中部。有南、北两源：南源出各姿各雅山;北源卡多曲，出高原上残留的一连串小湖。两源汇合后，经卡日涌(滩)，汇马曲，注入扎陵湖。长190.1千米，流域面积3138平方千米。"], ["卡若区", "名。旧称“察木多”。在西藏自治区昌都市中南部，邻接青海省，澜沧江上源扎曲和昂曲在境内汇合。市人民政府驻地。面积1.07万平方千米。人口11万(2017年)。区人民政府驻城关镇。1913年置昌都县。后西藏地方政府设昌都宗。1960年合并原拉多宗复置昌都县。2014年昌都县撤销，改设卡若区。经济以农业为主，兼有牧业。森林茂密，多珍稀野生动物。并产冬虫夏草、贝母等药材。工业有电力、建材、皮革、机械等。214、317国道交此。古迹有卡若遗址、绛巴林(昌都寺)。"], ["卡若遗址", "中国新石器时代重要遗址。位于西藏昌都加卡乡卡若村。年代为公元前3200前2000年。1978—1979年发掘。发现房址28座，为圆形或方形的无立壁圜底房屋，以室内的立柱和周边的斜柱搭成圆锥形窝棚式建筑。半地穴式房屋普遍以草拌泥涂抹穴壁，后进步为贴靠穴壁垒砌石墙，有的还在上部续建一层楼居，显示出鲜明的地方建筑特色。地面式建筑室内柱洞的排列都较规则，初具“间”的雏形。工具以大型打制石器为主，还有细石器和磨制石器，骨器也较丰富。几何图案形刻画纹陶器最富特征，个别的兼施黑色彩纹。所有陶器都是平底，器形简单。发现有农作物粟和家畜猪、牛遗骨，经济生活以粟作农业为主，兼营狩猎。是澜沧江上游地区的代表性遗存，故命名为“卡若文化”。为全国重点文物保护单位。"], ["卡萨布兰卡", "①即“达尔贝达”(670页)。②亦译《北非谍影》。美国故事片。华纳影片公司1942年出品。裘利斯·爱泼斯坦(JuliusEpstein,1909—2000）等根据伯纳特（MurrayBurnett,1910—1997)等创作的舞台剧本《人人都去里克酒店》改编。寇蒂斯(MichaelCurtiz,1886—1962)导演。鲍嘉、褒曼主演。1940年在北非的卡萨布兰卡，曾是反法西斯战士、现在经营酒店的里克邂逅不久前在巴黎失散的女友伊尔莎。此时的伊尔莎已同捷克抵抗运动战士维克多结婚，企图借道卡萨布兰卡逃离纳粹的追捕。里克克服内心的矛盾击毙盖世太保头子，并用买来的护照送伊尔莎夫妇上了飞机。获最佳影片等3项奥斯卡奖。"], ["卡萨布兰卡非洲宪章", "简称《非洲宪章》。1961年1月7日在卡萨布兰卡举行的非洲国家首脑会议(卡萨布兰卡会议)上通过。宪章宣布：与会各国决心促进非洲各地自由的胜利和团结一致;通过提供支援来解放仍然处于外国统治下的非洲领土；消灭各种形式的殖民主义;加强非洲国家间经济、社会和文化等方\n面的合作。还决定在条件许可的情况下尽快设立非洲协商议会，非洲政治、经济、文化等委员会及非洲联合最高司令部。"], ["卡萨布兰卡会议", "①美国总统罗斯福同英国首相丘吉尔于1943年1月14—23日在卡萨布兰卡举行。主要讨论：未来法国的政治\n制度问题；土耳其在战 争中的立场问题；盟国未来的作战计划。会议在研究 关于法属北非行政机构问题时，邀请\n法国的戴高乐和吉罗(Henri Giraud，1879—1949)出席，并促使戴高乐和吉罗达成协议。会议还划分了两国在亚洲的势力范围：英国对中东和巴尔干的军事和政治负完全“责任”，美国对远东负同样的“责任”；商定在意大利南部西西里展开军事行动的作战计划。②阿拉伯联合共和国(埃及、叙利亚)、阿尔及利亚、几内亚、加纳、马里、摩洛哥的国家首脑和利比亚的代表于1961年1月4—7日在卡萨布兰卡举行。主要讨论非洲各国人民在政治、经济、文化等方面维护主权，消灭各种形式的殖民主义等问题，强调非洲国家间的团结，坚决支持非洲人民的爱国正义斗争。会议决定建立非洲国家组织，并通过了《卡萨布兰卡非洲宪章》。"], ["卡萨尔斯", "(PabloCasals,1876—1973) 西班牙大提琴家。学于巴塞罗那及马德里。1889年起到世界各地演出。1905年与蒂博、科尔托组成“黄金三重奏团”。19191936年在巴塞罗那组织交响乐团并任指挥。1936—1939年西班牙\n内战时期，支持人民阵线。1939年移居法国南部普拉德(Prades)。此后，继续到各地演出并讲学。1955年到波多黎各，翌年创办卡萨尔斯音乐节，后卒于该国。演出曲目广泛，尤擅演奏巴赫的无伴奏组曲。其演奏和教学活动对现代大提琴演奏艺术的发展影响颇大。"], ["卡萨特", "(Mary Cassatt, 1844—1926) 美国女画家。1861—1865年在宾夕法尼亚美术学院学习。1866—1873年到欧洲游历，后定居法国。1877年其《艾达肖像》在沙龙展出，深得德加赞赏并介绍其参加印象派画展。擅作油画、色粉笔画和版画。以妇女和儿童为主要题材，色彩明快，富于变化而协调，作品大多充满欢愉情绪。还作有《喝茶》《包厢》《读\n<费加罗报>》《浴》等。版画作品受日本画风影响，多为铜版和腐蚀版画。"], ["卡塞尔", "(KarlGustav Cassel,1866—1945) 瑞典经济学家，瑞典学派的创始人之一。斯德哥尔摩大学教授。依据货币数量说，倡导购买力平价说。从“稀少性原理”出发，采取一般均衡理论，以价格形成为其理论体系的中心。是“价值无用论”的主要倡导者。著有《社会经济理论》《1914年以后的货币与外汇》等。"], ["卡塞姆", "(Abdul KarimKassem,1914—1963) 伊拉克总理(1958—1963)。1956年成为“自由军官组织”领导人。1958年领导七月革命，推翻费萨尔王朝，建立伊拉克共和国，任总理兼武装部队总司令、代理国防部长。执政期间，颁布土地改革法，退出巴格达条约组织。1963年2月在复兴党发动的政变中被推翻并处死。"], ["卡赛拉", "(Alfredo Casella,1883—1947)意大利作曲家、钢琴家。意大利现代派作曲家集团“先锋”的主要成员。曾在法国巴黎音乐学院从福雷等人学作曲，又师从法国钢琴家狄埃梅(Louis Diémer,1843—1919)。毕业后在该院执教，并一度任罗马圣茜茜莉亚(Santa Cecilia)学院附属音乐学校钢琴系主任。1917年在意大利创办民族音乐学会。1938年前常在欧美各国从事演出活动，推广现代主义音乐。其创作属新古典主义流派，作品有歌剧《蛇女》《奥菲欧的故事》，舞蹈喜剧《瓮》，交响曲3部，乐队组曲《意大利》及协奏曲、重奏曲、钢琴曲、独唱曲等。撰有《从完全终止的历史回溯音乐的流变》、论文集《21+26》等以及巴赫、贝多芬等的评传。"], ["卡山德", "(Cassandros,约前358—前297) 亦译“卡珊得”。古代马其顿王国国王(前305—前297)。安提帕特之子。父死后，公元前316年夺得马其顿、希腊统治权；杀死亚历山大(大帝)母后、王妃及幼子。前305年称王。联合托勒密一世(PtolemaiosI)、塞琉古一世(SeleucusI)等，于前301年易普斯战役中打败安提柯一世。"], ["卡珊德拉", "(Kassandra)亦译“珈桑德拉”。希腊神话中的特洛伊公主。得阿波罗帮助，能预卜吉凶，但因拒绝阿波罗的求爱，受到诅咒，从此无人再信她的预言。"], ["卡什凯人", "(Kashgais)亦译“卡什盖人”。伊朗西南部的民族，与巴赫蒂亚尔人为邻。约60万人(2001年)。语言属阿尔泰语系突厥语族。信伊斯兰教，属什叶派。主要从事牧羊业。部分已定居务农、织毯。过去很多人从事驮运业。"], ["卡斯蒂略", "安托尼奥·费利西亚诺·德·卡斯蒂略(António Feliciano de Castilho,1800—1875)。葡萄牙诗人。幼年失明。其创作由古典主义转向浪漫主义。精通多种语言，曾翻译莎士比亚、歌德、塞万提斯等人的作品。主要作品有《埃科致纳尔西佐的信》《春天》《爱情与忧伤》《城堡之夜》《诗人的嫉妒》《为农业祝福》等。②弗洛伦西奥·马利亚·德尔·卡斯蒂略(Florencio Maríadel Castillo,1828—1863)。墨西哥小说家。曾参加墨西哥人民反抗法国武装侵略的战争，被俘后死在狱中。作品有小说《百合花环》《隐痛》《天使的姐妹》等。"], ["卡斯尔雷", "(Robert Stewart, Viscount Castlereagh,1769—1822) 英国外交大臣(1812—1822)。托利党人。历任爱尔兰事务大臣、陆军大臣、殖民大臣等职。积极推动英、奥、普、俄四国同盟(1815年)，在维也纳会议中支持梅特涅的政策。拥护神圣同盟，为避免过多卷入，1820年以不干涉他国内政为由，拒绝该同盟关于参加对意大利皮埃蒙特(Piemonte)及那不勒斯和西班牙武装干涉的建议。"], ["卡斯特", "英语caste的音译。源自葡萄牙语casta,意为“族姓”“出身”。葡语又源出拉丁语castus,意为“纯洁的”。16世纪葡萄牙人初到印度时，用此词指阇提，后为欧洲人所沿用；近现代成为一般等级的通称。参见“种姓制度”(5780页)、“闍提”(3823页)。"], ["卡斯特尔维特罗", "(Lodovico Castelvetro,1505—1571) 意大利文艺理论家。主要美学著作《《诗学》提要与注释》，强调理性与经验、想象与虚构以及艺术的娱乐功能，认为美感源于题材的新奇和高超的技巧，被认为是文艺复兴时期对亚里士多德的美学思想持批判继承态度的革新派主要代表之一。因与持纯继承态度的保守派之间展开争论，在西方美学史上被称为“第一次古今之争”。在戏剧史上，被认为是“三一律”的最早提出者之一。"], ["卡斯特里", "(Castries) 圣卢西亚首都和港口。位于圣卢西亚岛西北岸。人口6.8万(2017年)。始建于1650年。天然良港，可泊吃水12米的海轮。全国外贸物资大部经此。工业以农产品加工为主。有机场。附近有古堡遗址、植物园。西北郊海滩为旅游疗养地。"], ["卡斯特罗", "(Fidel Castro,1926—2016)古巴共产党中央委员会第一书记（1961—2011)、国务委员会主席(1976—2008)。学于\n\n哈瓦那大学。1953年7月发动古巴革命，反对巴蒂斯塔政权。1959年革命胜利后出任古巴武装部队总司令，2月任政府总理。1960年5月与苏联建交，10月宣布古巴进入社会主义革命阶段。1961年1月与美国断\n\n交，同年4月在吉隆滩战役中指挥歼灭入侵的美国雇佣军，5月1日宣布古巴为社会主义国家，随后成立古巴社会主义革命统一党(1965年改名古巴共产党)，并担任中央委员会第一书记。1976年，古巴颁布新宪法后出任国务委员会主席和部长会议主席。曾派兵参与安哥拉内战。2008年、2011年先后辞去国务委员会主席和革命武装部队总司令及古巴共产党中央委员会第一书记职。"], ["卡斯腾", "(Dietrich Ludwig Gustav Karsten,1768—1810)德国矿物学家。弗赖贝格矿业学院(今弗赖贝格工业大学)博士。曾任矿冶高级工程师、政府矿务高级顾问。柏林科学院院士。1789年发表的2卷矿物学文集，被誉为德国开纪元的矿物大全。对德国矿物学和采矿工程学作出了重要贡献。著有《矿物图册》以及有关矿物、采矿工程方面的论文50余篇。"], ["卡斯提尔王国", "中世纪伊比利亚半岛中部卡斯提尔(Castilla,亦译“卡斯蒂尔”)地区的国家。原为10世纪一伯爵领地，属雷翁王国。1035年建独立王国，后成为半岛上的强国之一。在西班牙“收复失地运动”中，从阿拉伯人手中夺取大片土地。1469年其王位继承人伊萨伯拉与亚拉冈王子斐迪南结婚。1479年两国正式合并，基本完成西班牙的统一。"], ["卡塔尔", "(Qatar) 全称“卡塔尔国”(TheState of Qatar)。西亚国家。位于阿拉伯半岛\n\n东北岸卡塔尔半岛上。三面临波斯湾，南同阿拉伯联合酋长国和沙特阿拉伯接壤。包括附近小岛，面积 11 521 平方千米。人口270万（2017年)，卡塔尔人\n\n约占40%，其余为印度人、巴基斯坦人与东南亚人等。官方语言为阿拉伯语，通用英语。居民多信伊斯兰教。首都多哈。境内大部为平坦荒漠，南部多沙丘。最高海拔105米。气候干热，年降水量仅120毫米左右。石油和天然气资源丰富。公元7世纪为阿拉伯帝国一部分，1555年被并入奥斯曼帝国，1846年建立卡塔尔酋长国。1882年英国侵入，1916年沦为英国“保护国”。1971年9月3日宣布独立，称“卡塔尔国”。君主立宪制的酋长国。北部农业较盛，产椰枣、紫花苜蓿、玉米、柠檬等。畜牧业以养骆驼为主，沿海有渔业及珍珠采集业。国民收入绝大部分来自石油。有石油化工、液化气、化肥、水泥、炼铝等工厂。无铁路，各城之间以公路连接。出口主要为石油、液化气，合成氨、尿素、乙烯等；进口日用品、机器、食品、建材、油田设备等。"], ["卡塔尔人", "(Qatarians) ①具有卡塔尔国籍的人。②亦称“卡塔尔阿拉伯人”。卡塔尔的民族，阿拉伯人的一部分。约108万人(2017年)，约占全国人口40%。说阿拉伯语，属闪-含语系闪米特语族。仍保留部落组织结构。信伊斯兰教，多属瓦哈比派。主要从事农业，兼事渔业、畜牧业，部分在石油企业做工。"], ["卡塔赫纳", "(Cartagena)哥伦比亚北部港市，玻利瓦尔省(Bolívar)首府。临加勒比海\n\n卡塔赫纳湾。市区人口97.16万，大都市区人口108.66万(2016年)。建于1533年，16世纪中期曾为西班牙掠夺南美财富的转运港和奴隶市场。1926年随马格达莱纳河流域油田开发而成为主要油港和石油加工中心。腹地为农牧业产品集散地。工业以炼油、石化、纺织、制革、食品、船舶修理为主。有国际机场。市内有城堡、大教堂等古建筑。旅游业较盛。"], ["卡塔卡利舞", "印度古典舞蹈。与婆罗多舞、卡塔克舞、奥迪西舞并列为印度四大传统舞种。“卡塔卡利”(Kathakali)，意为“故事表演”。起源于约17世纪初的印度西南部喀拉拉邦，后传播渐广。大多取材于印度史诗《罗摩衍那》《摩诃婆罗多》及“往世书”，宗教色彩浓厚。表演者一般为男演员，舞蹈节奏鲜明有力，程式繁复多变，特别注重眼神及面部表情，有强烈的戏剧性，沿袭古代梵剧的形式与风格，以梵语伴唱。服装多为肥大的白裙，不同类型的角色有不同的脸谱，夸张而华丽。"], ["卡塔克舞", "印度古典舞蹈。与婆罗多舞、奥迪西舞、卡塔卡利舞并列为印度四大传统舞种。卡塔克(Kathak)，意为“讲故事者”。发\n\n源并流传于印度北部地区。表演内容大多为史诗和神话故事，以令人眩目的脚点技艺、快速如飞的旋转，以及舒展大方、线条明朗的舞姿而独树一帜。主要的伴奏乐器是塔布拉鼓。其表演一般由三部分组成，通过肢体动\n\n作和表情表现主题及情节，很多手势直接来源于日常生活。"], ["卡塔隆尼之战", "亦称“沙隆之战”。西罗马帝国与匈奴人的一次会战。公元451年，匈奴帝国皇帝阿提拉率大军越过莱茵河，突入高卢。6月，西罗马统帅埃底乌斯(FlaviusAëtius，约396—454)联合西哥特人等，与之大战于卡塔隆尼平原(Campi Catalaunici,约在今法国东北马恩河畔沙隆[Châlons-sur-Marne]与特鲁瓦城[Troyes]之间)。结果阿提拉战败，匈奴退至莱茵河以东。"], ["卡塔尼亚", "(Catania) 意大利西西里岛东岸港市。位于埃特纳火山南面，濒伊奥尼亚海。人口31.30万(2015年)。建于公元前729年。古希腊、罗马时代已为繁荣城市。屡遭埃特纳火山喷发损毁。18世纪重建。西西里岛工业中心。主要有机械、化工、纺织、食品等工业。铁路、公路枢纽。有卡塔尼亚大学(1434年)、卡塔尼亚大教堂、博物馆、植物园等。古迹有古希腊、古罗马剧场遗址和露天竞技场等。附近优良海滩是冬季游览地。"], ["卡塔耶夫", "( ,1897—1986)苏联作家。长篇小说《时间呀，前进》为其成名作。主要作品有长篇小说四部曲《黑海波涛》(《雾海孤帆》《草原上的田庄》《冬天的风》《为了苏维埃政权》)。卫国战争时期写有中篇小说《团的儿子》。"], ["卡特尔", "①法语cartel的音译，意为“联盟”“联合企业”。垄断组织的主要形式之一。生产同类商品的企业为垄断商品销售市场、获取高额垄断利润而订立的协定。内容包括：划分销售市场、确定商品产量或规定商品售价。参加者不得违反协定，但它们在生产上、商业上和法律上仍保持独立性。参加者之间为争取有利的销售市场和扩大产销限额进行着剧烈的竞争，常使协定瓦解。②詹姆斯·麦基恩·卡特尔(James McKeen Cattell,1860—1944)。美国心理学家。曾在德国莱比锡大学师从冯特，并任其助手。1886年获该校哲学博士学位。回国后先后任宾夕法尼亚大学和哥伦比亚大学教授。曾任美国心理学会会长和国际心理学会会长。创办《心理学评论》等杂志。创建心理学社，促进了心理学在工业和教育等领域的实际应用。对反应时间、知觉及语词联想、个性和能力的差异作了许多实验与研究，编制了第一套特殊能力的心理测验，并首先使用“心理测验”这一术语。为美国第一个心理学教授，培养了桑戴克、伍德沃思等许多心理学家。其论文和演讲被编为《科学家卡特尔》(上卷，心理学研究；下卷，演讲与论文)。"], ["卡特加特海峡", "(Kattegat)丹麦日德兰半岛同瑞典西南部之间的海峡。北经斯卡格拉克海峡与北海相连，南经厄勒海峡和大、小贝尔特海峡通波罗的海。长225千米，宽60\\~160千米，水深10\\~124米。冬季沿岸结冰。为波罗的海诸国通向大西洋的航运要道。"], ["卡特赖特", "（Edmund Cartwright，1743—1823)动力织机发明者。英国人。原为传教士。18世纪后期，英国棉纺业已使用动力，但棉织业还依靠手织。他于1785年发明动力织机，效率较前提高40倍。但该织机异常笨重，不甚完善，后经约翰逊(ThomasJohnson)、拉德克利夫(William Radcliffe)、霍洛克斯(John Horrocks)等人在 20多年中不断改进，才在织布业中大量推广。"], ["卡廷事件", "1940年春波兰战俘被集体枪杀的事件。1939年9月，苏联乘德国入侵波兰之机，出兵占领寇松线以东波兰领土，并俘虏大批波兰军人。1940年4月，在斯摩棱斯克附近卡廷(KaI)森林,4421名波兰军人被处决。后该地区被德军占领。1943年4月，德国占领当局宣布发现被杀波兰军人尸坑。苏联政府旋称此事系德军所为。第二次世界大战后，此事件成为悬案。1990年4月，苏联正式承认事件制造者为当时的苏联内务部门。"], ["卡通", "英语cartoon的音译。1指漫画、连环画。②即“动画影片”(938页)。"], ["卡图卢斯", "(GaiusValeriusCatullus，约前84一约前54)古罗马诗人。生于维罗纳。年轻时移居罗马。参加号称“新诗人”的团体。作品以抒情诗最为著名，传世作品共116篇，大多抒写他对勒斯比娅的爱情。还写有挽歌和讽刺诗等。其诗作对文艺复兴和后世欧洲抒情诗的发展很有影响。"], ["卡托-堪布累齐和约", "亦译《卡托-坎布雷西和约》。结束意大利战争的和约。1559年4月，以法国为一方，西班牙、英国、萨伏依公国等为另一方，在法国卡托-堪布累齐(LeCateau-Cambrésis)签订。规定：法国在意大利占有的领土大部分归属西班牙，并放弃对意大利其他领土的一切要求。战争中支持西班牙的萨伏依公国取得皮埃蒙特大部地区。法国在洛林只保留梅斯、图勒(Toul)和凡尔登，并从英国手中赎回加来港。"], ["卡托纳", "(Katona József,约1791—1830)匈牙利剧作家。所著悲剧《班克总督》揭露13世纪侵占匈牙利的日耳曼封建统治者的贪婪残暴，反映了农民反抗封建统治和民族压迫的情绪。"], ["卡托普利", "(captopril)亦称“巯甲丙脯酸”。化学式C9H15NO3S。抗高血压药。作用较强和口服有效的血管紧张素转换酶抑制剂。能减少血管紧张素Ⅱ的生成和缓激肽的水解，从而舒张外周血管，降低总外周阻力而降压，还能降低肾血管阻力，增加肾血流量。降压时不伴有反射性心动过速。用于治疗原发性及肾性高血压。副作用有呛咳、皮疹、发热，少数患者可有粒细胞减少及蛋白尿，还可增加血钾浓度。"], ["卡托维兹", "(Katowice)波兰南部城市，西里西亚省(Ślaskie)首府。人口29.99万(2015年)。1598年始见于记载。19世纪后期随采煤工业发展而兴起。全国最大的铁路枢纽。采煤工业中心，有钢铁、重型机械、化工、炼锌、电子、印刷等工业。有西里西亚歌剧院、博物馆，以及综合性大学、矿业大学和煤炭工业研究所等。"], ["卡瓦尔康提", "(Guido Cavalcanti，1258—1300)意大利诗人。柔美新诗体代表。但丁的好友。曾经积极参加佛罗伦萨城的政治活动。其抒情诗对于男女情爱作了完整的分析，赞赏女性情操和美德。著名的诗篇有《因为我希望再也不会回去》等。"], ["卡瓦列罗", "(José de la Luzy Caballero,1800—1862)古巴哲学家、教育家。哈瓦那圣卡洛斯神学院毕业。曾任母校教授。倾向唯物主义的感觉论，认为必须摆脱一切独断论，研究人的生活规律和自然规律。主张改革教育制度，要求加强自然科学的教学。主要著作有《选民的哲学》《哲学谈话》《关于物理学的谈话》等。"], ["卡维地洛", "(carvedilol)化学式C24H26N2O4。抗心绞痛药。阻断β1、β2和α肾上腺素能受体，又有一定的抗氧化作用，可用于心绞痛、心功能不全和高血压的治疗。"], ["卡维尔盐漠", "(Dasht-e-Kavīr)波斯语意即“盐质荒漠”。在伊朗中北部干燥盆地里。东西延绵450千米，南北宽100\\~200千米，平均海拔600\\~800米。荒漠内部盐沼广布，富含多种有益的矿盐。西部有纳马克盐湖(Namak)。"], ["卡文迪许", "(Henry Cavendish,1731—1810)英国物理学家、化学家。学于剑桥大学。英国\n\n皇家学会会员。1798年用扭秤实验验证了万有引力定律，从而确定了引力常数和地球的平均密度。在化学上，证明了水和空气的组成。著有《关于空气的实验》。"], ["卡西基亚雷河", "(RíoCasiquiare) 委内瑞拉\n\n南部奥里诺科河上游天然分洪道。洪水期分注内格罗河。长约400千米，宽200米，深10\\~15米。沟通亚马孙河、奥里诺科河两大水系。水量丰富，可通航。"], ["卡西勒", "(Ernst Cassirer,1874—1945) 德国哲学家、美学家，新康德主义马堡学派代表之\n\n一。学于柏林大学。曾任汉堡大学教授。1933年纳粹执政后流亡国外。1941年移居美国，在耶鲁大学、哥伦比亚大学任客座教授。倡导“符号形式哲学”(亦译“象征形式哲学”)。在美学上，为当代西方符号论流派的\n\n创始人与主要代表。主要著作有《符号形式哲学》《近代哲学和科学的认识问题》《论人——对人类文化哲学的介绍》等。"], ["卡西米尔三世", "(KazimierzⅢ，13091370)波兰国王(1333—1370)。在位时加强王权，力图削弱德意志贵族在波兰的势力。实行币制改革，保护商业和手工业，并创办克拉科夫大学。死后无嗣，皮雅斯特王朝终结。"], ["卡西尼", "(Giovanni DomenicoCassini,16251712)法国天文学家。生于意大利佩里纳尔多。1673年加入法国国籍。曾任博洛尼亚\n\n大学天文学教授、巴黎天文台台长。法兰西科学院院士、英国皇家学会会员。发现土星的4颗卫星(土卫八、土卫五、土卫三和土卫四)和土星光环的缝隙(卡西尼环缝)，测定木星和火星的自转周期、太阳视差和地球子午\n\n线的长度，编制第一份木卫星历表和一幅大型月面图。家族四代均为天文学家。著有《已被证实的天文学原理》。"], ["卡西尼定则", "描述月球运动的法则。由法国天文学家卡西尼于1693年提出，故名。有三项：（1）月球自转周期等于公转周期；(2) 月球赤道与黄道相交成1°32′;(3)月球赤道相对于黄道的升交点与月球公转轨道相对于黄道的降交点重合。"], ["卡西人", "(Khasis)亦称“卡西雅人”。印度的民族。约67万人(2001年)。主要分布在阿萨姆邦。分七大支系：博伊人、米基尔人、瓦尔人、林甘人、哈丹姆人、卡西人本支和普纳尔人。语言属南亚语系孟-高棉语族。信奉多神教，部分改信天主教和基督教新教。有母系氏族组织残余。以农业为生，兼事狩猎和捕鱼。另有约7.5万人在孟加拉国。"], ["卡亚俄", "(Callao)秘鲁最大海港，卡亚俄省首府。位于太平洋岸卡亚俄湾内，外有圣洛伦索岛(San Lorenzo)为屏障。人口40.69万(2015年)。利马外港，距利马约13千米，有铁路、公路相通。建于1537年。工业有鱼类加工、酿酒、肉类加工、制糖、造船等。天然良港，港口设施优良，对外贸易大多经此。有船舶研究院和航海院校等。圣洛伦索岛上设海军基地。"], ["卡宴", "(Cayenne)法属圭亚那首府。位于卡宴河河口卡宴岛西北岸，濒大西洋。地势低湿。人口5.76万(2015年)。始建于1643年。1674年被法国占领，曾作为罪犯流放地。农产品集散地。有锯木和酿酒、食品加工等工厂。主要贸易港，外有沙滩，涨潮时大轮方能驶入。有国际机场。"], ["卡扬人", "(Kayans)亦称“内陆达雅克人”。达雅克人的一部分。加里曼丹岛中部和东部的原住民。约52万人(1995年)。印度尼西亚西加里曼丹部分，多住在马哈坎河(Mahakam)和卡普阿斯河(Kapuas)的上游，与肯尼雅人合称巴豪(Bahau)部落，约45万人。马来西亚沙捞越部分，住在巴兰河(Baram)、拉让河(Rajang)的上游。说马来语。种旱稻、椰子等。部分信伊斯兰教，少数信基督教新教，一般信万物有灵。喜爱雕刻、绘画、音乐。以建造长屋著名，大者容数十户，住数百人。"], ["卡伊", "卡伊(Kayes)亦译“卡伊斯”。马里西境城市。位于塞内加尔河中游南岸。人口14.8万(2012年)。塞内加尔河航运起点，铁路通巴马科和达喀尔。有制革、水泥等厂。花生、畜产品和阿拉伯树胶贸易甚盛。"], ["卡赞", "卡赞(Elia Kazan,1909—2003)美国电影、戏剧导演，编剧。生于奥斯曼帝国伊斯坦布尔(今属土耳其)。1913年随父母移居美国。就读于威廉学院和耶鲁大学戏剧系。1932年起参加戏剧演出并拍摄纪录电影。1947年与人合办演员养成所，提倡方法派表演体系。导演电影20余部，主要影片有《君子协定》(兼编剧)、《欲望号街车》、《万岁，萨巴德》、《在江边》、《东方伊甸园》等。两度获奥斯卡最佳导演奖，并获奥斯卡和柏林国际电影节荣誉奖等。曾受到非美活动调查委员会迫害。著有自传。"], ["卡赞扎基斯", "卡赞扎基斯(NikosKazantzakis，18851957)希腊作家。早年学习法律，曾去法国学哲学。1924年起写作长篇史诗《奥德修续纪》，引入种种现代思想和对社会问题的探求。另有长篇小说《阿勒克西·卓尔巴斯的一生》《再次受难的基督》《兄弟残杀》等。1957年访问中国，在归途中病逝。"], ["卡扎尔王朝", "卡扎尔王朝亦译“恺加王朝”。波斯封建王朝(1796—1925)。由卡扎尔部落(Kajar)的阿迦·穆罕默德建立，定都德黑兰。统治时期，对内压迫和奴役各族人民，对外屈服于英、俄侵略者。1925年为巴列维王朝取代。"], ["卡扎菲", "卡扎菲(Muammar Gaddafi,1942—2011)利比亚最高领导人(1969—2011)。1969年领导“自由军官组织”发动政变，推翻伊德里斯王朝（史称“九一革命”)，建立阿拉伯利比亚共和国，任革命指挥委员会主席和武装部队总司令。翌年兼任总理和国防部长。1971年创建阿拉伯社会主义联盟，任主席。1977年改国名为“阿拉伯利比亚社会主义民众国”，任总人民代表大会总秘书处秘书长，兼任武装部队最高统帅。19821983年任非洲统一组织主席。1986年改国名为“大阿拉伯利比亚人民社会主义民众国”。实行家族专制统治。2011年春内战爆发，同年8月其政权被推翻。10月死于逃亡地苏尔特(Surt)。著有《绿皮书》《革命经历》等。"], ["卡纸", "卡纸厚度介于纸张与纸板之间的一类纸。分为白色的白卡纸和有色的米卡纸(象牙卡纸)两类。纸质紧密、强韧，富有弹性。多用作卡片、明信片、请柬、菜谱等。"], ["卡卓语", "卡卓语自称“卡卓”(kha55tso31)的云南蒙古族使用的语言。属汉藏语系藏缅语族彝语支。主要分布在云南省通海县兴蒙乡的5个村子。使用人口约5400。音节结构简单，无辅音韵尾，均为开音节。有7个声调。语法以虚词和语序为主要表达手段。有比较丰富的结构助词。语序是主语一宾语一谓语，名词、代词作定语在中心词之前，形容词、数量词作定语在中心词 function cardHTML(it){

  const st = stVal(a);

  const cls = st==='ok' ? ' ok' : (a && a._dirty) ? ' dirty' : '';

  if(!a) return;
  card.querySelector('.f-char').value = a.char != null ? a.char : '';
  card.querySelector('.f-meaning').value = a.meaning != null ? a.meaning : '';
  card.querySelector('.f-note').value = a.note || '';
}
function paint(card){
  const a = answers[card.dataset.wid], st = stVal(a);
  card.classList.toggle('ok', st==='ok');
  card.classList.toggle('issue', st==='issue');
  card.classList.toggle('dirty', !!(a && a._dirty));
  const mk = card.querySelector('.okmark'); if(mk) mk.textContent = st==='ok' ? '已核' : '';
}

function render(){
  const q = (document.getElementById('q').value||'').trim().toLowerCase();
  const list = document.getElementById('list');
  let n=0, done=0;
  const frag = document.createDocumentFragment();
  for(const it of ITEMS){
    if(filters.only==='problem' && !(it.tags&&it.tags.length) && !it.auto_ok && it.t!=='fig') continue;
    if(filters.only==='done' && stVal(answers[it.wid])!=='ok') continue;
    if(filters.only==='todo' && stVal(answers[it.wid])==='ok') continue;
    if(filters.tag.size && !(it.tags||[]).some(t=>filters.tag.has(t))) continue;
    if(q){
      const body = it.t==='fig' ? [it.kind, it.page, it.caption].join(' ') : it.meaning;
      const hay = [it.wid,it.char,it.pinyin,body,(it.entries||[]).map(e=>e.join(' ')).join(' ')].join(' ').toLowerCase();
      if(!hay.includes(q)) continue;
    }
    const card = document.createElement('div');
    card.innerHTML = cardHTML(it).trim();
    frag.appendChild(card.firstChild);
    n++;
    if(stVal(answers[it.wid])==='ok') done++;
  }
  list.innerHTML='';
  list.appendChild(frag);
  refreshStat(n, done);
}
function refreshStat(n, done){
  const nAll = ITEMS.length, nOk = Object.keys(answers).filter(w=>answers[w]&&answers[w].status==='ok').length;
  document.getElementById('stat').textContent = `显示 ${n} / 共 ${nAll} · 已核 ${nOk}`;
}

// 构建标签栏
(function(){
  const bar = document.getElementById('tagbar');
  const counts = {};
  ITEMS.forEach(it=>(it.tags||[]).forEach(t=>counts[t]=(counts[t]||0)+1));
  Object.keys(counts).sort().forEach(t=>{
    const el = document.createElement('span');
    const idx = Object.keys(TAGLAB).indexOf(t);
    el.className = `chip tagc${idx>=0?idx%8:7}`;
    el.textContent = `${TAGLAB[t]||t} ${counts[t]}`;
    el.onclick = ()=>{ if(filters.tag.has(t)) filters.tag.delete(t); else filters.tag.add(t);
      el.classList.toggle('on', filters.tag.has(t)); render(); };
    bar.appendChild(el);
  });
})();

document.addEventListener('input', e=>{
  const card = e.target.closest('.card'); if(!card) return;
  answers[card.dataset.wid] = readCard(card);
  paint(card); save();
});
document.addEventListener('click', e=>{
  const card = e.target.closest('.card');
  if(e.target.classList && e.target.classList.contains('rm')){ // 删词条行
    const wid = card.dataset.wid, i = +e.target.closest('.ent').dataset.i;
    const a = answers[wid];
    if(a){ a.entries.splice(i,1); }
    else {
      const src = ITEMS.find(x=>x.wid===wid);
      const arr = src.entries.map(en=>en.slice()); arr.splice(i,1);
      answers[wid] = {char:src.char, meaning:src.meaning, entries:arr, status:'', _dirty:true};
    }
    save(); render(); return;
  }
  if(e.target.classList && e.target.classList.contains('add-ent')){ // 加词条行
    const wid = card.dataset.wid;
    if(!answers[wid]){
      const src = ITEMS.find(x=>x.wid===wid);
      answers[wid] = {char:src.char, meaning:src.meaning,
        entries: src.entries.map(en=>en.slice()), status:'', _dirty:true};
    }
    answers[wid].entries.push(['','']);
    save(); render(); return;
  }
  if(!card) return;
  const wid = card.dataset.wid;
  if(e.target.classList.contains('do-ok') || e.target.classList.contains('do-issue')){
    const a = readCard(card); a.status = e.target.dataset.st; a._dirty = false;
    answers[wid] = a; paint(card); save(); return;
  }
  if(e.target.classList.contains('do-redo')){ // 重新填写：解除已核，回到可编辑
    const a = answers[wid];
    if(a) { delete a.status; a._dirty = false; }
    paint(card); save(); render(); return;
  }
  if(e.target.classList.contains('do-reset')){ // 还原本项为初始值
    delete answers[wid]; writeCard(card); paint(card); save(); render(); return;
  }
});
document.getElementById('q').addEventListener('input', render);
document.getElementById('fAll').onclick = ()=>{filters.only='';render();};
document.getElementById('fOnlyProblem').onclick = ()=>{filters.only='problem';render();};
document.getElementById('fDone').onclick = ()=>{filters.only='done';render();};
document.getElementById('fTodo').onclick = ()=>{filters.only='todo';render();};
document.getElementById('btnExport').onclick = ()=>{
  const out = {letter:L, exported_at:new Date().toISOString(),
    answers:Object.fromEntries(Object.entries(answers).filter(([k,v])=>v && (v._dirty||v.status||v.note)))};
  const blob = new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='review_'+L+'_result.json'; a.click();
};
render();
</script></body></html>
