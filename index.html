<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>辞海数字化 · 访问口令</title>
<style>
*{box-sizing:border-box;} body{margin:0;font-family:"Microsoft YaHei",sans-serif;background:#1a3a6b;
  min-height:100vh;display:flex;align-items:center;justify-content:center;}
.box{background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);
  padding:34px 38px;width:min(380px,90vw);text-align:center;}
h1{font-size:20px;color:#1a3a6b;margin:0 0 6px;}
.sub{color:#666;font-size:13px;margin-bottom:20px;line-height:1.6;}
input{width:100%;padding:11px 12px;border:1px solid #bbb;border-radius:8px;font-size:16px;text-align:center;}
button{margin-top:14px;width:100%;padding:11px;border:none;border-radius:8px;background:#1a5fb4;
  color:#fff;font-size:15px;cursor:pointer;}
button:hover{background:#154a8f;}
#msg{color:#c62828;font-size:13px;min-height:18px;margin-top:10px;}
</style></head><body>
<div class="box">
  <h1>辞海数字化 · 人工修正</h1>
  <div class="sub">请输入访问口令以进入修正门户</div>
  <input id="pw" type="password" placeholder="口令" autocomplete="off">
  <button id="btn">进入</button>
  <div id="msg"></div>
</div>
<script>
var KEY='06ee4e2249250a6c64612f65191f512bf22ae0c54e32ac695f2c215bf03a970c';
function sha256hex(str){ // 浏览器原生 WebCrypto，可靠
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)).then(
    function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
    });
}
document.getElementById('btn').onclick=function(){
  var v=document.getElementById('pw').value;
  sha256hex(v).then(function(h){
    if(h===KEY){
      localStorage.setItem('cidian_lock', JSON.stringify({exp:Date.now()+7*86400000}));
      location.replace('portal.html');
    } else {
      document.getElementById('msg').textContent='口令错误，请重试';
    }
  });
};
document.getElementById('pw').addEventListener('keydown',function(e){ if(e.key==='Enter')document.getElementById('btn').click(); });
</script></body></html>
