function stVal(a){ return (a && a.status) ? a.status : ''; }

function cardHTML(it){
  const a = answers[it.wid] || {};
  const st = stVal(a);
  const isFig = it.t === 'fig';
  const cls = st==='ok' ? ' ok' : (a && a._dirty) ? ' dirty' : '';
  const tags = (it.tags||[]).map((t,i)=>`<span class="tag tagc${i%8}">${TAGLAB[t]||t}</span>`).join('') +
      (it.auto_ok ? '<span class="tag tag-auto">AI已核销</span>' : '');
  const okmark = st==='ok' ? '<span class="okmark">已核</span>' : '';
  let head;
  if(isFig){
    head = `<div class="row"><span class="lbl">问题</span><span class="tag tagc4">${esc(it.kind)}</span>
      <span class="wid">${esc(it.page)}</span> ${esc(it.wid)} ${okmark}</div>`;
  } else {
    const curChar = (a.char != null ? a.char : it.char);
    head = `<div class="row"><span class="lbl">字头</span>
      <input class="in f-char" value="${esc(curChar)}" placeholder="字头汉字">
      <span class="wid">${esc(it.wid)}</span> ${esc(it.pinyin||it.group)} ${okmark}</div>`;
  }
  const rows = isFig ? '' : (a.entries || it.entries).map((en,i)=>`
    <div class="ent" data-i="${i}">
      <input class="in w entw" value="${esc(en[0])}" placeholder="词条">
      <input class="in entd" value="${esc(en[1])}" placeholder="释义">
      <button class="rm" title="删除词条">×</button></div>`).join('');
  return `<div class="card${cls}${isFig?' figcard':''}" data-wid="${esc(it.wid)}">
    <img class="tn${it.img?'':' none'}" loading="lazy" src="${it.img?('data:image/jpeg;base64,'+it.img):''}" alt="">
    <div class="fields">
      ${head}
      ${tags?`<div class="row" style="margin-left:60px">${tags}</div>`:''}
      <div class="row"><span class="lbl">${isFig?'图注':'释义'}</span><textarea class="in f-meaning" rows="3">${esc(a.meaning!=null?a.meaning:(isFig?it.caption:it.meaning))}</textarea></div>
      ${isFig?'':`<div class="ents">${rows||'<div style="color:#999">（无词条）</div>'}</div>
      <div class="row" style="margin-left:60px"><button class="add-ent">+ 词条</button></div>`}
      <div class="ops">
        <button class="op do-ok" data-st="ok">✓ 已核</button>
        <button class="op do-issue" data-st="issue">! 标为问题</button>
        <button class="op do-redo">重新填写</button>
        <button class="op do-reset">还原</button>
        <input class="note f-note" value="${esc(a.note||'')}" placeholder="备注（可选）">
      </div>
    </div></div>`;
}

function readCard(card){
  const wid = card.dataset.wid, it = ITEMS.find(x=>x.wid===wid);
  const a = answers[wid] || {};
  const fchar = card.querySelector('.f-char');
  const ent = card.querySelectorAll('.ent');
  return { char: fchar ? fchar.value : '',
           meaning: card.querySelector('.f-meaning').value,
           entries: [...ent].map(r=>[r.querySelector('.entw').value, r.querySelector('.entd').value]),
           note: card.querySelector('.f-note').value,
           status: a.status||'', _dirty:true };
}
function writeCard(card){
  const a = answers[card.dataset.wid];
  if(!a) return;
  card.querySelector('.f-char').value = a.char != null ? a.char : '';
  card.querySelector('.f-meaning').value = a.meaning != null ? a.meaning : '';
  card.querySelector('.f-note').value = a.note || '';
}
function paint(card){
  const a = answers[card.dataset.wid], st = stVal(a);
  card.classList.toggle('ok', st==='ok');
  card.classList.toggle('issue', st==='issue');
  card.classList.toggle('dirty', !!(a && a._dirty));
  const mk = card.querySelector('.okmark'); if(mk) mk.textContent = st==='ok' ? '已核' : '';
}

function render(){
  const q = (document.getElementById('q').value||'').trim().toLowerCase();
  const list = document.getElementById('list');
  let n=0, done=0;
  const frag = document.createDocumentFragment();
  for(const it of ITEMS){
    if(filters.only==='problem' && !(it.tags&&it.tags.length) && !it.auto_ok && it.t!=='fig') continue;
    if(filters.only==='done' && stVal(answers[it.wid])!=='ok') continue;
    if(filters.only==='todo' && stVal(answers[it.wid])==='ok') continue;
    if(filters.tag.size && !(it.tags||[]).some(t=>filters.tag.has(t))) continue;
    if(q){
      const body = it.t==='fig' ? [it.kind, it.page, it.caption].join(' ') : it.meaning;
      const hay = [it.wid,it.char,it.pinyin,body,(it.entries||[]).map(e=>e.join(' ')).join(' ')].join(' ').toLowerCase();
      if(!hay.includes(q)) continue;
    }
    const card = document.createElement('div');
    card.innerHTML = cardHTML(it).trim();
    frag.appendChild(card.firstChild);
    n++;
    if(stVal(answers[it.wid])==='ok') done++;
  }
  list.innerHTML='';
  list.appendChild(frag);
  refreshStat(n, done);
}
function refreshStat(n, done){
  const nAll = ITEMS.length, nOk = Object.keys(answers).filter(w=>answers[w]&&answers[w].status==='ok').length;
  document.getElementById('stat').textContent = `显示 ${n} / 共 ${nAll} · 已核 ${nOk}`;
}

// 构建标签栏
(function(){
  const bar = document.getElementById('tagbar');
  const counts = {};
  ITEMS.forEach(it=>(it.tags||[]).forEach(t=>counts[t]=(counts[t]||0)+1));
  Object.keys(counts).sort().forEach(t=>{
    const el = document.createElement('span');
    const idx = Object.keys(TAGLAB).indexOf(t);
    el.className = `chip tagc${idx>=0?idx%8:7}`;
    el.textContent = `${TAGLAB[t]||t} ${counts[t]}`;
    el.onclick = ()=>{ if(filters.tag.has(t)) filters.tag.delete(t); else filters.tag.add(t);
      el.classList.toggle('on', filters.tag.has(t)); render(); };
    bar.appendChild(el);
  });
})();

document.addEventListener('input', e=>{
  const card = e.target.closest('.card'); if(!card) return;
  answers[card.dataset.wid] = readCard(card);
  paint(card); save();
});
document.addEventListener('click', e=>{
  const card = e.target.closest('.card');
  if(e.target.classList && e.target.classList.contains('rm')){ // 删词条行
    const wid = card.dataset.wid, i = +e.target.closest('.ent').dataset.i;
    const a = answers[wid];
    if(a){ a.entries.splice(i,1); }
    else {
      const src = ITEMS.find(x=>x.wid===wid);
      const arr = src.entries.map(en=>en.slice()); arr.splice(i,1);
      answers[wid] = {char:src.char, meaning:src.meaning, entries:arr, status:'', _dirty:true};
    }
    save(); render(); return;
  }
  if(e.target.classList && e.target.classList.contains('add-ent')){ // 加词条行
    const wid = card.dataset.wid;
    if(!answers[wid]){
      const src = ITEMS.find(x=>x.wid===wid);
      answers[wid] = {char:src.char, meaning:src.meaning,
        entries: src.entries.map(en=>en.slice()), status:'', _dirty:true};
    }
    answers[wid].entries.push(['','']);
    save(); render(); return;
  }
  if(!card) return;
  const wid = card.dataset.wid;
  if(e.target.classList.contains('do-ok') || e.target.classList.contains('do-issue')){
    const a = readCard(card); a.status = e.target.dataset.st; a._dirty = false;
    answers[wid] = a; paint(card); save(); return;
  }
  if(e.target.classList.contains('do-redo')){ // 重新填写：解除已核，回到可编辑
    const a = answers[wid];
    if(a) { delete a.status; a._dirty = false; }
    paint(card); save(); render(); return;
  }
  if(e.target.classList.contains('do-reset')){ // 还原本项为初始值
    delete answers[wid]; writeCard(card); paint(card); save(); render(); return;
  }
});
document.getElementById('q').addEventListener('input', render);
document.getElementById('fAll').onclick = ()=>{filters.only='';render();};
document.getElementById('fOnlyProblem').onclick = ()=>{filters.only='problem';render();};
document.getElementById('fDone').onclick = ()=>{filters.only='done';render();};
document.getElementById('fTodo').onclick = ()=>{filters.only='todo';render();};
document.getElementById('btnExport').onclick = ()=>{
  const out = {letter:L, exported_at:new Date().toISOString(),
    answers:Object.fromEntries(Object.entries(answers).filter(([k,v])=>v && (v._dirty||v.status||v.note)))};
  const blob = new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='review_'+L+'_result.json'; a.click();
};
render();
</script></body></html>
